<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ee4d2d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="msapplication-TileColor" content="#ee4d2d">
    <title>DecoCake.my</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/product-catalog.css">
    <link rel="stylesheet" href="./src/catalog-configurator.css">
    <link rel="stylesheet" href="./src/customer-catalog-dashboard.css">
    <link rel="stylesheet" href="./src/customer-address-validation.css">
</head>
<body>
    <div id="app"></div>
    <script type="module">
        void (async () => {
            const params = new URLSearchParams(window.location.search);
            const trackingToken = params.get('tracking');

            if (trackingToken) {
                await import('./src/tracking-page.ts');
                return;
            }

            await import('./src/legacy-customer-token-compat.ts');
            await import('./src/main.ts');
            await import('./src/product-catalog.ts');
            await import('./src/catalog-route-context-fix.ts');
            await import('./src/catalog-configurator.ts');
            await import('./src/customer-portal.ts');
            await import('./src/customer-order-lifecycle-ui.ts');
            await import('./src/customer-catalog-dashboard.ts');
            await import('./src/cash-pickup-flow.ts');
            await import('./src/pickup-payment-state-fix.ts');
            await import('./src/admin-auth-ui.ts');
            await import('./src/admin-route-bridge.ts');
            await import('./src/admin-v2-route.tsx');
            await import('./src/admin-order-lifecycle.ts');
            await import('./src/wasapflow-control-center-v5.ts');
            await import('./src/whatsapp-control-production-audit.ts');
            await import('./src/whatsapp-control-connection-guard.ts');
            await import('./src/admin-auto-notification-ui.ts');
            await import('./src/whatsapp-queue-worker.ts');
            await import('./src/customer-whatsapp-login.ts');
            await import('./src/customer-account-stability.ts');
            await import('./src/customer-account.ts');
            await import('./src/customer-address-validation.ts');
            await import('./src/secure-customer-address-validation.ts');
            await import('./src/shipping-dashboard.ts');
        })();
    </script>
</body>
</html>
