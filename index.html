<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ee4d2d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest?v=4">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
    <meta name="msapplication-TileColor" content="#ee4d2d">
    <title>DecoCake.my</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/product-catalog.css">
    <link rel="stylesheet" href="./src/catalog-configurator.css">
    <link rel="stylesheet" href="./src/customer-catalog-dashboard.css">
    <link rel="stylesheet" href="./src/customer-address-validation.css">
</head>
<body>
    <div id="app"></div>
    <script type="module">
      (async () => {
        const adminRoute = new URLSearchParams(location.search).get('admin');
        const isAdmin = adminRoute === 'v2' || adminRoute === '1';

        if (isAdmin) {
          await import('./src/admin-v2-route.tsx');
          return;
        }

        await import('./src/legacy-customer-token-compat.ts');
        // Register the canonical WhatsApp OTP interceptor before legacy UI handlers.
        await import('./src/customer-whatsapp-login.ts');
        if (new URLSearchParams(location.search).has('pickup')) {
          await import('./src/customer-pickup-checkout.ts');
          return;
        }
        await import('./src/main.ts');
        await import('./src/product-catalog.ts');
        await import('./src/catalog-route-context-fix.ts');
        await import('./src/catalog-configurator.ts');
        await import('./src/customer-portal.ts');
        await import('./src/customer-order-lifecycle-ui.ts');
        await import('./src/customer-order-safety.ts');
        await import('./src/customer-catalog-dashboard.ts');
        await import('./src/cash-pickup-flow.ts');
        await import('./src/pickup-payment-state-fix.ts');
        await import('./src/customer-account-stability.ts');
        await import('./src/customer-account.ts');
        await import('./src/customer-address-validation.ts');
        await import('./src/secure-customer-address-validation.ts');
        await import('./src/shipping-dashboard.ts');
        await import('./src/admin-v2-route.tsx');
      })().catch((error) => {
        console.error('[boot]', error);
        const app = document.getElementById('app');
        if (app && !app.childElementCount) {
          app.innerHTML = '<div style="padding:24px;font-family:Arial,sans-serif">App failed to start. Please refresh.</div>';
        }
      });
    </script>
</body>
</html>
