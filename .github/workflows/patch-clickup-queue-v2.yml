name: Patch ClickUp Queue V2
on:
  push:
    branches: [feat/clickup-queue-v2]
    paths:
      - 'icetak-admin/src/pages/ClickUpQueue.tsx'
      - 'icetak-admin/src/pages/ClickUpQueue.css'
      - 'scripts/patch_clickup_queue_v2.py'
      - '.github/workflows/patch-clickup-queue-v2.yml'
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clickup-queue-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch App and Sidebar
        run: python scripts/patch_clickup_queue_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Build Admin V2
        run: npm ci && npm run build
        working-directory: icetak-admin
      - name: Commit scoped patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icetak-admin/src/App.tsx icetak-admin/src/components/Sidebar.tsx icetak-admin/src/pages/ClickUpQueue.tsx
          git commit -m "wire ClickUp Queue into Admin V2"
          git push
