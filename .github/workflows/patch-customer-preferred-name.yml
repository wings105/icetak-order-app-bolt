name: Patch Customer Preferred Name
on:
  push:
    branches: [fix/customer-preferred-name-20260810]
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-preferred-name-20260810
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_customer_preferred_name.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Build Admin V2
        working-directory: icetak-admin
        run: npm ci && npm run build
      - name: Commit scoped patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icetak-admin/src/pages/Orders.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'add admin preferred customer name editor'
          git push
