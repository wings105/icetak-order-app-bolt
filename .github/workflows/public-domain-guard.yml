name: Public Domain Guard

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block legacy Bolt URLs in active runtime source
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for p in src public supabase/functions .github/workflows; do
            [ -e "$p" ] && paths+=("$p")
          done
          if grep -RIn --exclude='public-domain-guard.yml' -- 'icetak\.bolt\.host' "${paths[@]}"; then
            echo 'Legacy icetak.bolt.host URL found in active runtime source.'
            exit 1
          fi
          echo 'No legacy Bolt public URL in active runtime source.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check stock gateway authorization and retries
        run: npm run check:stock-admin

      - name: Check roadmap priority and review coverage
        run: npm run check:roadmap-checker

      - name: Check acrylic production colour and access boundaries
        run: npm run check:acrylic-production

      - name: Check task workspace authorization and brief readiness
        run: npm run check:task-workspace && npm run check:task-readiness && npm run check:detail-automation && npm run check:task-design && npm run check:task-clickup && npm run check:task-station

      - name: Check Shopee card sending and existing reply paths
        run: |
          npm run check:inbox-order-work
          npm run check:conversation-lifecycle
          npm run check:inbox-clickup
          npm run check:shopee-cards
          node --experimental-strip-types scripts/check-shopee-direct.mjs
          node --experimental-strip-types scripts/test-shopee-image.mjs
          node --experimental-strip-types scripts/test-shopee-read.mjs

      - name: Vite dev server smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/vite-dev.log 2>&1 &
          VITE_PID=$!
          cleanup() { kill "$VITE_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/tmp/home.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/vite-dev.log
            echo 'Vite dev server did not become ready.'
            exit 1
          fi

          grep -q 'DecoCake.my' /tmp/home.html
          curl -fsS http://127.0.0.1:5173/manifest.webmanifest | grep -q 'DecoCake.my'
          curl -fsS -o /dev/null http://127.0.0.1:5173/favicon.ico
          curl -fsS -o /dev/null http://127.0.0.1:5173/android-chrome-192x192.png
          curl -fsS -o /dev/null http://127.0.0.1:5173/android-chrome-512x512.png
          curl -fsS -o /dev/null http://127.0.0.1:5173/src/main.ts
          curl -fsS -o /dev/null http://127.0.0.1:5173/src/catalog-configurator.ts
          curl -fsS -o /dev/null http://127.0.0.1:5173/src/admin-v2-route.tsx
          echo 'Vite dev server smoke test passed.'

      - name: Build production frontend
        run: npm run build

      - name: Verify roadmap references and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/roadmap/ROADMAP_MASTER_PLAN_2026.md
          test -s docs/roadmap/SHOPEE_ADS_API_TESTS_20261023.md
          grep -q 'reference_url' src/roadmap.ts
          grep -q 'Buka dokumen rujukan' src/roadmap.ts
          grep -q 'add column if not exists reference_url' supabase/migrations/20261023183000_roadmap_reference_url.sql

      - name: Check release feed and topic UI
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/roadmap-changelog.json
          test -s docs/roadmap/README.md
          test -s docs/roadmap/RELEASE_COVERAGE_2026.md
          node -e "const x=require('./dist/roadmap-changelog.json'); if(x.total < 60 || x.total !== x.releases.length || !x.releases.some(y=>y.feature_codes.includes('IC-014'))) process.exit(1);"
          grep -q "highlights" src/roadmap.ts
          grep -q "acceptance_criteria" src/roadmap.ts
          grep -q "roadmap-changelog.json" src/roadmap.ts
          grep -q "Product Roadmap" README.md

      - name: Verify nested roadmap build and absolute assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/roadmap/index.html
          grep -q 'iCetak Roadmap' dist/roadmap/index.html
          grep -Eq 'src="/assets/[^"]+\.js"' dist/roadmap/index.html
          grep -Eq 'href="/assets/[^"]+\.css"' dist/roadmap/index.html
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          test -s dist/mockup/index.html
          test -s dist/acrylic-production/index.html

