name: Patch Orders pickup lifecycle
on:
  push:
    branches: [fix/orders-pickup-lifecycle-20260808]
    paths:
      - scripts/patch_orders_pickup_lifecycle.py
      - .github/workflows/patch-orders-pickup-lifecycle.yml
jobs:
  patch-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_orders_pickup_lifecycle.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build root app
        run: npm ci && npm run build
      - name: Build Admin V2
        working-directory: icetak-admin
        run: npm ci && npm run build
      - name: Commit scoped patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icetak-admin/src/pages/Orders.tsx icetak-admin/src/pages/OrdersEnterprise.css src/customer-portal.ts supabase/functions/whatsapp-send/index.ts supabase/functions/whatsapp-dispatch/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix order work queue pickup automation and preview modal"
          git push
