name: Verify restored Orders editor build
on:
  push:
    paths:
      - .github/workflows/restore-orders-editor-bolt.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-v2-react-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Install admin dependencies
        working-directory: icetak-admin
        run: npm ci
      - name: Build Admin V2
        working-directory: icetak-admin
        run: npm run build
