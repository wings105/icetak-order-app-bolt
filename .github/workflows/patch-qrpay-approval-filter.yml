name: Patch QRPay Approval Filter
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_qrpay_approval_filter.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_qrpay_approval_filter.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Build Admin V2
        run: npm ci && npm run build
        working-directory: icetak-admin
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_qrpay_approval_filter.py .github/workflows/patch-qrpay-approval-filter.yml
          git add icetak-admin/src/pages/QrPayDailySummary.tsx
          git commit -m "keep blocked AI orders in Need Approval"
          git push
