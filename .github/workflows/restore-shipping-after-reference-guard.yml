name: Restore Shipping After Reference Guard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_shipping_after_reference_guard.py'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore last known-good Shipping and add reference guard
        run: python scripts/restore_shipping_after_reference_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Build Admin V2
        run: npm ci && npm run build
        working-directory: icetak-admin
      - name: Commit restored Shipping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icetak-admin/src/pages/Shipping.tsx
          git commit -m "restore Shipping V2 and guard order references"
          git push
