name: One-time Orders structural editor patch
on:
  push:
    paths:
      - scripts/patch_orders_structural_editor.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_orders_structural_editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git add icetak-admin/src/pages/Orders.tsx icetak-admin/src/components/OrderItemStructuralEditor.tsx
          git commit -m "tighten structural item edit locking"
          git push origin HEAD:main
