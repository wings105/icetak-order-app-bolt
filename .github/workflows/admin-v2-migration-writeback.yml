name: Admin V2 Migration Writeback

on:
  push:
    branches:
      - migration/admin-v2-only

permissions:
  contents: write

jobs:
  strip-legacy-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/admin-v2-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Strip dormant Admin V1 from customer main
        run: node scripts/strip-legacy-admin-main.mjs

      - name: Validate customer app still builds
        run: |
          npm ci
          npm run build

      - name: Commit deterministic cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "remove dormant Admin V1 from customer main"
          git push origin HEAD:migration/admin-v2-only
