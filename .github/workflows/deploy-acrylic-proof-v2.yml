name: Deploy Acrylic Proof v2
on:
  push:
    branches: [production]
    paths: [.github/workflows/deploy-acrylic-proof-v2.yml]
  workflow_dispatch:
concurrency:
  group: acrylic-proof-production
  cancel-in-progress: false
jobs:
  reconcile-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: buivecgahhmrhlmfujgt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download live source without deploying
        run: |
          test "$GITHUB_REF_NAME" = production
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$RUNNER_TEMP/acrylic-live"
          cd "$RUNNER_TEMP/acrylic-live"
          supabase functions download clickup-order-brief --project-ref "$PROJECT_REF" --use-api
      - name: Sync only live acrylic modules into production source
        run: |
          cp "$RUNNER_TEMP/acrylic-live/supabase/functions/clickup-order-brief/acrylic-rules.ts" supabase/functions/clickup-order-brief/acrylic-rules.ts
          cp "$RUNNER_TEMP/acrylic-live/supabase/functions/clickup-order-brief/acrylic.ts" supabase/functions/clickup-order-brief/acrylic.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/clickup-order-brief/acrylic-rules.ts supabase/functions/clickup-order-brief/acrylic.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve exact live acrylic source before proof fix'
            git push origin HEAD:production
          fi
