name: Deploy Acrylic Proof v2
on:
  push:
    branches: [production]
    paths: [.github/workflows/deploy-acrylic-proof-v2.yml]
  workflow_dispatch:
concurrency:
  group: acrylic-proof-production
  cancel-in-progress: false
jobs:
  deploy-tested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: buivecgahhmrhlmfujgt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download exact live source
        run: |
          test "$GITHUB_REF_NAME" = production
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$RUNNER_TEMP/acrylic-live"
          cd "$RUNNER_TEMP/acrylic-live"
          supabase functions download clickup-order-brief --project-ref "$PROJECT_REF" --use-api
      - name: Guard known live baseline or already deployed result
        run: |
          for name in acrylic-rules.ts acrylic.ts; do
            path="supabase/functions/clickup-order-brief/$name"
            git show "bb088695cd8ce55ed2b696c1be0b9bf593f18c66:$path" > "$RUNNER_TEMP/before-$name"
            cmp "$RUNNER_TEMP/before-$name" "$RUNNER_TEMP/acrylic-live/$path" || cmp "$path" "$RUNNER_TEMP/acrylic-live/$path"
          done
      - name: Re-run proof regression on final source
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const s=readFileSync('scripts/apply-acrylic-proof-v2.mjs','utf8');
          writeFileSync('scripts/.proof-test.mjs',"import assert from 'node:assert/strict';\n"+s.slice(s.indexOf('const {acrylicRules}=await import')));
          JS
          node --experimental-strip-types scripts/.proof-test.mjs
      - name: Overlay only tested acrylic files and initialize CLI config
        run: |
          cp supabase/functions/clickup-order-brief/acrylic-rules.ts "$RUNNER_TEMP/acrylic-live/supabase/functions/clickup-order-brief/acrylic-rules.ts"
          cp supabase/functions/clickup-order-brief/acrylic.ts "$RUNNER_TEMP/acrylic-live/supabase/functions/clickup-order-brief/acrylic.ts"
          cd "$RUNNER_TEMP/acrylic-live"
          if [ ! -f supabase/config.toml ]; then printf 'project_id = "buivecgahhmrhlmfujgt"\n' > supabase/config.toml; fi
      - name: Deploy AutoBrief with original token authentication
        run: |
          cd "$RUNNER_TEMP/acrylic-live"
          set +e
          result=$(supabase functions deploy clickup-order-brief --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes 2>&1)
          code=$?
          printf '%s\n' "$result"
          if [ "$code" -ne 0 ]; then echo "::error::$(printf '%s' "$result" | head -c 4000 | tr '\n' ' ')"; fi
          exit "$code"
      - name: Verify deployed modules match tested production byte for byte
        run: |
          mkdir -p "$RUNNER_TEMP/acrylic-verified"
          cd "$RUNNER_TEMP/acrylic-verified"
          supabase functions download clickup-order-brief --project-ref "$PROJECT_REF" --use-api
          cmp "$GITHUB_WORKSPACE/supabase/functions/clickup-order-brief/acrylic-rules.ts" supabase/functions/clickup-order-brief/acrylic-rules.ts
          cmp "$GITHUB_WORKSPACE/supabase/functions/clickup-order-brief/acrylic.ts" supabase/functions/clickup-order-brief/acrylic.ts
