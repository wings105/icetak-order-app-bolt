name: Product Catalogue CI

on:
  push:
    branches:
      - feature/product-slugs-search
      - fix/product-catalog-backend-wiring
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify backend catalogue wiring
        run: |
          grep -q "productCatalogRoutes, syncProductCatalog" backend/index.ts
          grep -q "\.\.\.productCatalogRoutes" backend/index.ts
          grep -q "productCatalogSyncHandler" backend/index.ts
