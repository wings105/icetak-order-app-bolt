name: Product Catalogue Branch CI

on:
  push:
    branches:
      - feature/product-slugs-search
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-slugs-search

      - name: Wire catalogue modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          backend = Path('backend/index.ts')
          source = backend.read_text()
          if "./product-catalog-routes" not in source:
              source = source.replace(
                  "import { externalOrderRoutes } from './external-order-routes';",
                  "import { externalOrderRoutes } from './external-order-routes';import { productCatalogRoutes, syncProductCatalog } from './product-catalog-routes';"
              )
          if 'productCatalogSyncHandler' not in source:
              source = re.sub(
                  r'export const handler\s*=\s*router\(\{',
                  "export const productCatalogSyncHandler=async()=>{const result=await syncProductCatalog();return {statusCode:200,body:JSON.stringify(result)}};\nexport const handler = router({",
                  source,
                  count=1
              )
          if '...productCatalogRoutes' not in source:
              source = source.replace(' ...externalOrderRoutes,', ' ...externalOrderRoutes,...productCatalogRoutes,')
          backend.write_text(source)

          index = Path('index.html')
          html = index.read_text()
          if './src/product-catalog.css' not in html:
              html = html.replace(
                  '    <link rel="stylesheet" href="./src/styles.css">',
                  '    <link rel="stylesheet" href="./src/styles.css">\n    <link rel="stylesheet" href="./src/product-catalog.css">'
              )
          if './src/product-catalog.ts' not in html:
              html = html.replace(
                  '    <script type="module" src="./src/main.ts"></script>',
                  '    <script type="module" src="./src/main.ts"></script>\n    <script type="module" src="./src/product-catalog.ts"></script>'
              )
          index.write_text(html)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit wired entrypoints
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.ts index.html
          git commit -m "feat: wire product catalogue entrypoints [skip ci]"
          git push
