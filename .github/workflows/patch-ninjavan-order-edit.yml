name: Patch NinjaVan Order Edit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ninjavan_order_edit.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_ninjavan_order_edit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: icetak-admin/package-lock.json
      - name: Build Admin V2
        run: npm ci && npm run build
        working-directory: icetak-admin
      - name: Commit Orders patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icetak-admin/src/pages/Orders.tsx
          git commit -m "add NinjaVan to Admin V2 order courier edit"
          git push
