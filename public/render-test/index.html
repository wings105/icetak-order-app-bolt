<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>iCetak Render Test</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
h1{margin:0 0 6px;font-size:24px}.muted{color:#6b7280;font-size:14px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border:0;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.canvas-wrap{background:#e5e7eb;border-radius:14px;padding:10px}
canvas{display:block;width:100%;height:auto;background:#fff;border-radius:8px}
.badge{display:inline-flex;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;font-size:12px}
.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="grid">
      <section>
        <div class="canvas-wrap"><canvas id="c" width="1447" height="2048"></canvas></div>
      </section>
      <aside>
        <span class="badge">POC renderer v1</span>
        <h1>iCetak Template Renderer</h1>
        <p class="muted">SKU-based render test. No Photoshop / Photopea needed.</p>

        <label>SKU</label>
        <input id="sku" value="YS0184" />

        <label>Customize Name</label>
        <input id="name" value="Jayna turns 4" />

        <div class="actions">
          <button id="render">Render</button>
          <button class="secondary" id="copy">Copy URL</button>
          <button class="secondary" id="download">Download PNG</button>
        </div>

        <label>Current URL</label>
        <pre id="url"></pre>

        <p class="muted">Rule for YS0184: uppercase, yellow fill, blue outline, auto-shrink to fit the ribbon.</p>
        <p id="msg" class="muted"></p>
      </aside>
    </div>
  </div>
</main>

const CONFIGS = {
  YS0184: {
    width: 1447, height: 2048,
    text: {x: 724, y: 831, maxWidth: 620, maxFont: 86, minFont: 34, fill:"#ffe600", stroke:"#0645d8", strokeWidth:16}
  }
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const skuEl = document.getElementById("sku");
const nameEl = document.getElementById("name");
const msg = document.getElementById("msg");
const urlEl = document.getElementById("url");
const img = new Image();

function fitFont(text, cfg){
  let size = cfg.maxFont;
  do{
    ctx.font = "900 " + size + "px Impact, Arial Black, sans-serif";
    if(ctx.measureText(text).width <= cfg.maxWidth) return size;
    size -= 2;
  }while(size >= cfg.minFont);
  return cfg.minFont;
}

function updateUrl(){
  const u = new URL(location.href);
  u.searchParams.set("sku", skuEl.value.trim().toUpperCase());
  u.searchParams.set("name", nameEl.value.trim());
  history.replaceState({}, "", u);
  urlEl.textContent = u.toString();
}

function render(){
  const sku = skuEl.value.trim().toUpperCase();
  const text = nameEl.value.trim().toUpperCase();
  const cfg = CONFIGS[sku];
  if(!cfg || !BASES[sku]){
    msg.className="err";
    msg.textContent="SKU belum ada template config.";
    return;
  }
  msg.className="muted";
  canvas.width=cfg.width; canvas.height=cfg.height;
  img.onload = ()=>{
    ctx.clearRect(0,0,cfg.width,cfg.height);
    ctx.drawImage(img,0,0,cfg.width,cfg.height);
    const fs=fitFont(text,cfg.text);
    ctx.font="900 "+fs+"px Impact, Arial Black, sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.lineJoin="round";
    ctx.miterLimit=2;
    ctx.strokeStyle=cfg.text.stroke;
    ctx.lineWidth=cfg.text.strokeWidth;
    ctx.strokeText(text,cfg.text.x,cfg.text.y);
    ctx.fillStyle=cfg.text.fill;
    ctx.fillText(text,cfg.text.x,cfg.text.y);
    msg.textContent="Rendered: "+sku+" · "+text+" · font "+fs+"px";
  };
  img.src = BASES[sku];
  updateUrl();
}

const params = new URLSearchParams(location.search);
skuEl.value = (params.get("sku") || "YS0184").toUpperCase();
nameEl.value = params.get("name") || "Jayna turns 4";
document.getElementById("render").onclick=render;
document.getElementById("copy").onclick=async()=>{ updateUrl(); await navigator.clipboard.writeText(urlEl.textContent); msg.textContent="URL copied."; };
document.getElementById("download").onclick=()=>{ render(); setTimeout(()=>{ const a=document.createElement("a"); a.download=(skuEl.value+"-"+nameEl.value.replace(/[^a-z0-9]+/gi,"-")+".png").toLowerCase(); a.href=canvas.toDataURL("image/png"); a.click(); },150); };
nameEl.addEventListener("keydown",e=>{if(e.key==="Enter")render()});
skuEl.addEventListener("keydown",e=>{if(e.key==="Enter")render()});
render();
</script>
