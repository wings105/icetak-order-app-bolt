<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>QRPay Draft Review · iCetak</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f5f5;color:#171717;font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:12px;font-weight:800;letter-spacing:.06em;color:#666}.badge{padding:6px 10px;border-radius:999px;background:#fff3cd;color:#735c0f;font-size:12px;font-weight:800}.badge.confirmed{background:#dff6e7;color:#126b32}.badge.rejected{background:#ffe6e6;color:#9d2424}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #ececec}.pay{background:#101010;color:#fff}.pay-grid,.grid,.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pay small{color:#bbb;display:block}.pay strong{font-size:22px}.alert{padding:11px;border-radius:10px;background:#fff4df;color:#8b5200;margin:10px 0}.success{background:#e7f8ed;color:#146b36}.grid{grid-template-columns:repeat(2,1fr)}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#555}input,select,textarea{width:100%;padding:10px;border:1px solid #d7d7d7;border-radius:9px;background:#fff;font:inherit}textarea{min-height:68px}.items-head,.item-head{display:flex;justify-content:space-between;align-items:center}.item{border:1px solid #e8e8e8;border-radius:12px;padding:12px;margin:10px 0;background:#fbfbfb}.item-grid{display:grid;grid-template-columns:1.1fr 1.4fr .55fr .65fr;gap:8px}.item-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.save{background:#111;color:#fff}.soft{background:#eef1f5}.red{background:#fff0f0;color:#ad2929}.green{background:#148b4b;color:#fff}.mini{border:1px solid #ddd;background:#fff;padding:5px 8px;border-radius:7px;margin:5px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:0;background:#ffffffef;padding:12px;border-radius:13px;border:1px solid #ddd;backdrop-filter:blur(6px)}.totals{grid-template-columns:repeat(4,1fr)}.totalbox{padding:12px;background:#f8f8f8;border-radius:10px}.totalbox small{display:block;color:#666}.difference.bad b{color:#c72d2d}.difference.ok b{color:#138a49}.muted{color:#777;font-size:13px}.msg{padding:9px;border-radius:10px;margin:7px 0;max-width:88%;font-size:13px}.msg.cust{background:#e9f7ed;margin-left:auto}.msg.shop{background:#f0f1f3}.msg b,.msg small,.event span,.event small,.correction small{font-size:11px;color:#777}.event,.correction{padding:10px;border-bottom:1px solid #eee}.link{color:#0b63ce;text-decoration:none}.raw{max-height:300px;overflow:auto;background:#111;color:#ddd;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap}.toast{position:fixed;right:16px;top:16px;background:#111;color:#fff;padding:12px;border-radius:10px;z-index:99}.locked input,.locked select,.locked textarea{background:#eee}.loading{padding:80px 20px;text-align:center;color:#666}.summary-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #e5e5e5}.summary-line:last-child{border:0}.summary-line b{white-space:nowrap}@media(max-width:700px){.pay-grid,.grid,.totals,.item-grid,.item-grid2{grid-template-columns:1fr}.wrap{padding:10px}.top{align-items:center}.actions{bottom:6px}}
  </style>
</head>
<body>
<div id="app"><div class="loading">Loading QRPay draft…</div></div>
<script>
(() => {
  const DATA_URL='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-data';
  const ACTION_URL='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-review';
  const token=new URLSearchParams(location.search).get('token')||'';
  const app=document.getElementById('app');
  const types=['printed','edible','acrylic','wafer','burnaway','mirror'];
  let D=null,items=[];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=v=>Number.isFinite(Number(v))?Number(v):0;
  const money=v=>'RM'+num(v).toFixed(2);
  const digits=v=>{let d=String(v??'').replace(/\D/g,'');if(d.startsWith('0'))d='60'+d.slice(1);else if(d.startsWith('1'))d='60'+d;return d};
  const locked=()=>['confirmed','rejected'].includes(String(D?.status||''));
  function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2500)}
  async function api(action,extra={}){const r=await fetch(ACTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Action failed');return j}
  function itemHtml(x,i){const opts=types.map(k=>`<option value="${k}" ${(x.k||x.product_type)===k?'selected':''}>${k}</option>`).join('');return `<div class="item"><div class="item-head"><b>Item ${i+1}</b>${!locked()?`<button class="mini remove" data-i="${i}">Remove</button>`:''}</div><div class="item-grid"><label>Product Type<select class="f k" ${locked()?'disabled':''}>${opts}</select></label><label>Title / Theme<input class="f title" value="${esc(x.title||'')}" ${locked()?'disabled':''}></label><label>Qty<input class="f qty" type="number" min="1" value="${Math.max(1,num(x.qty||1))}" ${locked()?'disabled':''}></label><label>Unit Price<input class="f price" type="number" min="0" step="0.01" value="${num(x.price||0)}" ${locked()?'disabled':''}></label></div><div class="item-grid2"><label>Size<input class="f size" value="${esc(x.size||'')}" ${locked()?'disabled':''}></label><label>Style / Shape / Color<input class="f style" value="${esc(x.style||'')}" ${locked()?'disabled':''}></label></div><label>Wording<textarea class="f wording" ${locked()?'disabled':''}>${esc(x.wording||x.custom_text||'')}</textarea></label></div>`}
  function readItems(){document.querySelectorAll('.item').forEach((r,i)=>{const old=items[i]||{},k=r.querySelector('.k').value,w=r.querySelector('.wording').value.trim();items[i]={...old,k,product_type:k,title:r.querySelector('.title').value.trim(),qty:Math.max(1,num(r.querySelector('.qty').value||1)),price:num(r.querySelector('.price').value||0),size:r.querySelector('.size').value.trim(),style:r.querySelector('.style').value.trim(),wording:w,custom_text:w,review:'Need Review',review_required:true,customization:{...(old.customization||{}),admin_reviewed:true}}});calc()}
  function renderItems(){const el=document.getElementById('items');if(!el)return;el.innerHTML=items.map(itemHtml).join('')||'<div class="alert">Tiada item.</div>';document.querySelectorAll('.f').forEach(e=>e.oninput=readItems);document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.i),1);renderItems()});calc()}
  function calc(){if(!D)return;const sub=items.reduce((s,x)=>s+num(x.price)*Math.max(1,num(x.qty||1)),0),ship=num(document.getElementById('delivery_fee')?.value||0),total=sub+ship,pay=num(D.payment_amount),diff=total-pay;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('itemSubtotal',money(sub));set('shippingTotal',money(ship));set('draftTotal',money(total));set('difference',(diff>=0?'+':'-')+money(Math.abs(diff)));const box=document.getElementById('differenceBox');if(box)box.className='totalbox difference '+(Math.abs(diff)<.01?'ok':'bad');const p=[];if(!items.length)p.push('Tambah item.');const del=document.getElementById('delivery')?.value||'unknown';if(del==='unknown')p.push('Pilih Shipping / Pickup.');if(del!=='pickup'&&del!=='unknown'&&!document.getElementById('address')?.value.trim())p.push('Alamat courier wajib.');if(!document.getElementById('date_need')?.value)p.push('Date Need wajib.');const ph=String(document.getElementById('customer_phone')?.value||'').replace(/\D/g,'');if(!/^(?:60|0)?1\d{8,9}$/.test(ph))p.push('WhatsApp tak sah.');if(Math.abs(diff)>=.01)p.push('Draft Total mesti sama dengan Payment Received.');const val=document.getElementById('validation');if(val){val.style.display=p.length?'block':'none';val.textContent=p.join(' ')}const c=document.getElementById('confirm');if(c)c.disabled=p.length>0}
  function payload(){readItems();const p=D.working_draft||{};return {...p,customer:{...(p.customer||{}),name:document.getElementById('customer_name').value.trim(),phone:document.getElementById('customer_phone').value.trim(),address_line1:document.getElementById('address').value.trim(),postcode:document.getElementById('postcode').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim()},items,date_need:document.getElementById('date_need').value||null,delivery:document.getElementById('delivery').value,delivery_fee:num(document.getElementById('delivery_fee').value||0)}}
  function eventLog(){const es=D.events||[];return es.length?[...es].reverse().map(e=>`<div class="event"><b>${esc(e.event_type)}</b><span>${esc(e.actor||'')} · ${esc(new Date(e.created_at).toLocaleString('en-MY',{timeZone:'Asia/Kuala_Lumpur'}))}</span></div>`).join(''):'<div class="muted">Belum ada event.</div>'}
  function correctionLog(){const rows=D.corrections||[];return rows.length?rows.map(c=>{const r=c.qrpay_ai_learning_rules||{};return `<div class="correction"><b>${esc(c.field_path)}</b><div><del>${esc(JSON.stringify(c.ai_value))}</del> → <ins>${esc(JSON.stringify(c.human_value))}</ins></div><small>${esc(c.strategy_key||'')} · rule ${esc(r.status||'candidate')} · seen ${esc(r.occurrence_count||1)}x</small>${r.id&&r.status!=='active'?`<button class="mini activate-rule" data-rule="${esc(r.id)}">Activate Rule</button>`:''}${r.id&&r.status!=='rejected'?`<button class="mini reject-rule" data-rule="${esc(r.id)}">Reject Rule</button>`:''}</div>`}).join(''):'<div class="muted">Belum ada human correction direkod.</div>'}
  function transcript(){const ms=D.evidence?.messages||D.working_draft?.evidence?.messages||[];return ms.length?ms.map(m=>`<div class="msg ${m.direction==='inbound'?'cust':'shop'}"><b>${m.direction==='inbound'?'CUSTOMER':'SELLER'}</b><small>${esc(m.at||'')}</small><div>${esc(m.text||`[${m.type||'message'}]`)}</div></div>`).join(''):'<div class="muted">Conversation evidence tidak tersedia.</div>'}
  function render(){const p=D.working_draft||{},pay=num(D.payment_amount),status=String(D.status||'pending_admin'),wa=digits(p?.customer?.phone||D.customer_phone),orderLink=D.order?.public_token?`https://icetak.bolt.host/?admin=v2&order=${encodeURIComponent(D.order.public_token)}`:'';items=structuredClone(p.items||[]);app.innerHTML=`<div class="wrap ${locked()?'locked':''}"><div class="top"><div><div class="brand">ICETAK · ADMIN</div><h2 style="margin:3px 0">QRPay AI Draft Review</h2><small>Draft ≠ Order · belum production / ClickUp sehingga admin Confirm</small></div><span class="badge ${status}">${esc(status.toUpperCase())}</span></div><section class="card pay"><div class="pay-grid"><div><small>PAYMENT RECEIVED · IMMUTABLE</small><strong>${money(pay)}</strong></div><div><small>Transaction ID</small><b>${esc(D.transaction_id)}</b></div><div><small>Received</small><b>${esc(new Date(D.payment_received_at).toLocaleString('en-MY',{timeZone:'Asia/Kuala_Lumpur'}))}</b></div></div></section>${status==='confirmed'?`<section class="card success"><b>✅ Confirmed → ${esc(D.order_no||'Order created')}</b>${orderLink?` · <a class="link" href="${esc(orderLink)}">Open Order</a>`:''}<div class="muted">AI original + human final + correction log disimpan.</div></section>`:''}${status==='rejected'?`<section class="card alert"><b>Demo / rejected draft — read only.</b></section>`:''}<section class="card"><h3>Customer & Date Need</h3><div class="grid"><label>Customer Name<input id="customer_name" value="${esc(p?.customer?.name||D.customer_name||'')}" ${locked()?'disabled':''}></label><label>WhatsApp<input id="customer_phone" value="${esc(p?.customer?.phone||D.customer_phone||'')}" ${locked()?'disabled':''}></label><label>Date Need (WAJIB)<input id="date_need" type="date" value="${esc(p.date_need||'')}" ${locked()?'disabled':''}></label><label>AI Match<input value="${Math.round(num(D.match_score)*100)}%" disabled></label></div>${wa?`<p><a class="link" target="_blank" href="https://wa.me/${wa}">Open WhatsApp ↗</a></p>`:''}</section><section class="card"><h3>Shipping / Pickup</h3><div class="grid"><label>Method<select id="delivery" ${locked()?'disabled':''}><option value="unknown">-- Pilih Shipping / Pickup --</option><option value="pickup">Pickup</option><option value="spx">SPX</option><option value="jnt">J&T</option><option value="ninja">Ninja Van</option></select></label><label>Shipping Fee<input id="delivery_fee" type="number" step="0.01" min="0" value="${esc(p.delivery_fee??D.shipping_fee??0)}" ${locked()?'disabled':''}></label><label>Address<input id="address" value="${esc(p?.customer?.address_line1||'')}" ${locked()?'disabled':''}></label><label>Postcode<input id="postcode" value="${esc(p?.customer?.postcode||'')}" ${locked()?'disabled':''}></label><label>City<input id="city" value="${esc(p?.customer?.city||'')}" ${locked()?'disabled':''}></label><label>State<input id="state" value="${esc(p?.customer?.state||'')}" ${locked()?'disabled':''}></label></div></section><section class="card"><div class="items-head"><h3>Order Items</h3>${!locked()?'<button id="addItem" class="btn soft">+ Add Item</button>':''}</div><div id="items"></div></section><section class="card"><h3>Order Total</h3><div class="totals"><div class="totalbox"><small>Item Subtotal</small><b id="itemSubtotal"></b></div><div class="totalbox"><small>Shipping</small><b id="shippingTotal"></b></div><div class="totalbox"><small>Draft Total</small><b id="draftTotal"></b></div><div id="differenceBox" class="totalbox difference"><small>Difference vs Payment</small><b id="difference"></b></div></div><div id="validation" class="alert" style="display:none"></div></section>${!locked()?`<div class="actions"><button id="save" class="btn save">Save Draft</button><button id="confirm" class="btn green">Confirm & Create Order</button><button id="rematch" class="btn soft">Wrong Customer / Rematch</button><button id="reject" class="btn red">Reject / Not an Order</button></div>`:''}<section class="card"><details open><summary>AI → Human Audit Log</summary>${eventLog()}</details><details><summary>Human Corrections & Learning</summary>${correctionLog()}</details><details><summary>Conversation Evidence</summary>${transcript()}</details><details><summary>AI Original Snapshot</summary><pre class="raw">${esc(JSON.stringify(D.ai_draft||{},null,2))}</pre></details><details><summary>Payment Webhook Snapshot</summary><pre class="raw">${esc(JSON.stringify(D.payment_snapshot||{},null,2))}</pre></details></section></div>`;
    const del=document.getElementById('delivery');if(del){del.value=p.delivery||'unknown';del.onchange=e=>{const fee={unknown:0,pickup:0,spx:4.5,jnt:5.9,ninja:6.9};if(num(document.getElementById('delivery_fee').value)===0||e.target.value==='pickup')document.getElementById('delivery_fee').value=fee[e.target.value]??0;calc()};['delivery_fee','date_need','customer_phone','address'].forEach(id=>document.getElementById(id).oninput=calc)}
    if(document.getElementById('addItem'))document.getElementById('addItem').onclick=()=>{items.push({k:'printed',product_type:'printed',title:'Cake Topper',qty:1,price:0,size:'',style:'',wording:'',review:'Need Review',review_required:true,customization:{admin_added:true}});renderItems()};
    if(document.getElementById('save'))document.getElementById('save').onclick=async()=>{try{await api('save',{payload:payload()});await load();toast('Draft saved')}catch(e){toast(e.message)}};
    if(document.getElementById('confirm'))document.getElementById('confirm').onclick=async()=>{if(!confirm('Confirm & CREATE order sebenar + queue ClickUp?'))return;try{await api('confirm',{payload:payload()});await load()}catch(e){toast(e.message)}};
    if(document.getElementById('rematch'))document.getElementById('rematch').onclick=async()=>{if(confirm('Customer match salah? AI akan cari conversation lain.')){try{await api('rematch');await load()}catch(e){toast(e.message)}}};
    if(document.getElementById('reject'))document.getElementById('reject').onclick=async()=>{const r=prompt('Reason:','Not an order');if(r!==null){try{await api('reject',{reason:r});await load()}catch(e){toast(e.message)}}};
    document.querySelectorAll('.activate-rule').forEach(b=>b.onclick=async()=>{if(confirm('Activate rule untuk order seterusnya?')){await api('rule',{rule_id:b.dataset.rule,status:'active'});await load()}});document.querySelectorAll('.reject-rule').forEach(b=>b.onclick=async()=>{await api('rule',{rule_id:b.dataset.rule,status:'rejected'});await load()});
    renderItems();
  }
  async function load(){if(!/^qrd_[a-f0-9]{32}$/i.test(token)){app.innerHTML='<div class="loading">Invalid draft link.</div>';return}try{const r=await fetch(DATA_URL+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Draft not found');D=j.draft;render()}catch(e){app.innerHTML='<div class="loading"><b>Draft tak dapat dibuka.</b><br><br>'+esc(e.message)+'</div>'}}
  load();
})();
</script>
</body>
</html>
