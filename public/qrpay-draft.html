<script>
(()=>{

 acrylic:{label:'Acrylic Cake Topper',shortLabel:'Acrylic',process:['Pre-order','Urgent'],sizes:['A7 Mini','A6 Standard','A5 Large'],styles:['Gold','Silver','Black','Rose Gold','Clear / Transparent','Dark Blue','Light Blue','Red','Yellow','Pink','Gold Glitter','Silver Glitter','Lilac / Light Purple','Mirror Blue','Bronze','Green','Orange','White'],defaultSize:'A7 Mini',defaultStyle:'Gold',defaultReview:'No Review'}
};

let D=null,items=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>'RM '+num(v).toFixed(2);
const isLocked=()=>['confirmed','rejected'].includes(String(D?.status||''));
function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2600)}
function kind(v){let k=String(v||'').toLowerCase();if(k==='topper'||k==='cake_topper')k='printed';return PRODUCTS[k]?k:'edible'}
function stylesFor(k,size){if(k==='edible'&&['4 inch','4.5 inch','5 inch','5.5 inch'].includes(size))return['Round / Bulat','Square / Petak','Love Shape / Hati','Custom'];return PRODUCTS[k].styles}
function sizeNorm(k,v){const cfg=PRODUCTS[k],raw=String(v||'').trim();if(cfg.sizes.includes(raw))return raw;if(k==='mirror'||k==='acrylic'){const u=raw.toUpperCase();if(u==='A7')return'A7 Mini';if(u==='A6')return'A6 Standard';if(u==='A5')return'A5 Large'}if(k==='printed')return'1 pc';const m=raw.match(/(\d+(?:\.\d+)?)\s*(?:inch|in|inci|\")?/i);if(m){const x=`${Number(m[1])} inch`;if(cfg.sizes.includes(x))return x}const u=raw.toUpperCase();return cfg.sizes.find(x=>x.toUpperCase()===u)||cfg.defaultSize}
function styleNorm(k,size,v){const list=stylesFor(k,size),raw=String(v||'').trim();if(list.includes(raw))return raw;const l=raw.toLowerCase();if(/round|bulat/.test(l)&&list.includes('Round / Bulat'))return'Round / Bulat';if(/square|petak/.test(l)&&list.includes('Square / Petak'))return'Square / Petak';if(/love|hati|heart/.test(l)&&list.includes('Love Shape / Hati'))return'Love Shape / Hati';if(/landscape/.test(l)&&list.includes('Full Landscape'))return'Full Landscape';if(/portrait/.test(l)&&list.includes('Full Portrait'))return'Full Portrait';return list.find(x=>x.toLowerCase()===l)||list[0]||PRODUCTS[k].defaultStyle}
function unitPrice(k,process,size,style,review){if(k==='printed')return 10;if(k==='mirror')return process==='Urgent'?18:15;if(k==='acrylic'){if(process==='Urgent')return size==='A7 Mini'?15:size==='A6 Standard'?25:40;return size==='A7 Mini'?12:size==='A6 Standard'?20:35}if(k==='burnaway'){if(size.includes('A4'))return 36;if(size.includes('A5'))return 18;const n=parseFloat(size)||0;return n>=6?30:n>=5?18:12}if(k==='wafer'){const base=size==='A4'?12:size==='A5'||size==='A6'?6:(parseFloat(size)||0)<=6?6:12;return base+(process==='Urgent'&&review==='Need Review'?2:0)}let base;if(size==='A4'||size==='Cupcake')base=24;else if(size==='A5')base=12;else if(size==='A6')base=6;else{const n=parseFloat(size)||0;base=style==='Square / Petak'&&size==='4 inch'?12:n>=6?24:n>=4.5?12:6}if(process==='Urgent'&&review==='Need Review')return base===6?7:base===12?14:base===24?28:base;return base}
function burnawayLayers(raw={}){const c=raw.customization||{},ls=c.layers||{},fallbackSize=sizeNorm('edible',raw.size),fallbackShape=styleNorm('edible',fallbackSize,raw.style),layer=(k,defaultSize)=>{const x=ls[k]||{},size=sizeNorm(k,x.size||defaultSize),shape=styleNorm(k,size,x.shape||x.style||fallbackShape);return{size,shape,wording:String(x.wording||raw.wording||raw.customText||'').trim(),referenceUrl:String(x.referenceUrl||x.reference_url||c.reference_url||'').trim()}};return{edible:layer('edible',fallbackSize),wafer:layer('wafer',sizeNorm('wafer',raw.size))}}
function itemUnitPrice(item){if(item.k!=='burnaway')return unitPrice(item.k,item.process,item.size,item.style,item.review);const l=item.customization?.layers||burnawayLayers(item);return unitPrice('edible','Pre-order',l.edible.size,l.edible.shape,'No Review')+unitPrice('wafer','Pre-order',l.wafer.size,l.wafer.shape,'No Review')}
function normalizeItem(raw={}){const k=kind(raw.k||raw.kind||raw.product_type),cfg=PRODUCTS[k];let process=String(raw.process||'').trim();if(!cfg.process.includes(process))process=/urgent/i.test(process)?'Urgent':cfg.process[0];let review=String(raw.review||'').trim();if(!['No Review','Need Review'].includes(review))review=(raw.review_required||raw.reviewRequired)?'Need Review':cfg.defaultReview;const size=sizeNorm(k,raw.size),style=styleNorm(k,size,raw.style),wording=String(raw.customText||raw.custom_text||raw.wording||'').trim(),referenceUrl=String(raw.referenceUrl||raw.reference_url||raw.customization?.reference_url||raw.product_snapshot?.image_url||'').trim(),layers=k==='burnaway'?burnawayLayers(raw):null,customization=layers?{...(raw.customization||{}),layers}:raw.customization;const item={...raw,k,kind:k,product_type:k,title:cfg.label,process,review,review_required:review==='Need Review',size:layers?`Edible ${layers.edible.size} • Wafer ${layers.wafer.size}`:size,style:layers?`Edible ${layers.edible.shape} • Wafer ${layers.wafer.shape}`:style,qty:Math.max(1,num(raw.qty||1)),wording,customText:wording,custom_text:wording,referenceUrl,customization};return{...item,price:itemUnitPrice(item)}}
function newItem(k){return normalizeItem({k,qty:1,customization:{admin_added:true}})}
async function api(action,extra={}){const r=await fetch(ACTION,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Action failed');return j}
function options(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function itemCard(item,index){const p=PRODUCTS[item.k],price=itemUnitPrice(item),layers=item.customization?.layers,locked=isLocked()?'disabled':'',layerFields=layers?`<label class="form-field"><span>Edible size</span><select class="layer" data-layer="edible" data-field="size" ${locked}>${options(PRODUCTS.edible.sizes.filter(v=>v!=='Cupcake'),layers.edible.size)}</select></label><label class="form-field"><span>Edible shape</span><select class="layer" data-layer="edible" data-field="shape" ${locked}>${options(stylesFor('edible',layers.edible.size),layers.edible.shape)}</select></label><label class="form-field"><span>Wafer size</span><select class="layer" data-layer="wafer" data-field="size" ${locked}>${options(PRODUCTS.wafer.sizes,layers.wafer.size)}</select></label><label class="form-field"><span>Wafer shape</span><select class="layer" data-layer="wafer" data-field="shape" ${locked}>${options(PRODUCTS.wafer.styles,layers.wafer.shape)}</select></label><label class="form-field wide2"><span>Edible wording</span><input class="layer" data-layer="edible" data-field="wording" value="${esc(layers.edible.wording)}" ${locked}></label><label class="form-field wide2"><span>Wafer wording</span><input class="layer" data-layer="wafer" data-field="wording" value="${esc(layers.wafer.wording)}" ${locked}></label>`:'';return `<section class="item-panel" data-i="${index}"><div class="item-head"><div><div class="item-title">${index+1}. ${esc(p.label)}</div><div class="item-price">${money(price)} / unit</div></div>${isLocked()?'':`<button class="btn btn-outline remove" data-i="${index}">Remove</button>`}</div><div class="item-grid"><label class="form-field"><span>Process</span><select class="process" ${isLocked()?'disabled':''}>${options(p.process,item.process)}</select></label><label class="form-field"><span>Review</span><select class="review" ${isLocked()?'disabled':''}>${options(['No Review','Need Review'],item.review)}</select></label>${layers?layerFields:`<label class="form-field"><span>Size</span><select class="size" ${isLocked()?'disabled':''}>${options(p.sizes,item.size)}</select></label><label class="form-field"><span>Style / Colour</span><select class="style" ${isLocked()?'disabled':''}>${options(stylesFor(item.k,item.size),item.style)}</select></label>`}<label class="form-field"><span>Qty</span><input class="qty" type="number" min="1" value="${Math.max(1,item.qty)}" ${isLocked()?'disabled':''}></label><label class="form-field wide2"><span>Wording / detail</span><input class="wording" value="${esc(item.wording)}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Reference URL</span><input class="reference" type="url" placeholder="https://..." value="${esc(item.referenceUrl)}" ${isLocked()?'disabled':''}></label></div></section>`}
function renderItems(){const box=document.getElementById('items');if(!box)return;box.innerHTML=items.length?items.map(itemCard).join(''):'<div class="panel"><div class="empty"><b>Belum ada produk</b><div>Pilih produk di atas.</div></div></div>';box.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.i),1);renderItems();calc()});box.querySelectorAll('.item-panel').forEach(card=>{const i=Number(card.dataset.i),rerender=patch=>{items[i]=normalizeItem({...items[i],...patch});renderItems();calc()};card.querySelector('.process')?.addEventListener('change',e=>rerender({process:e.target.value}));card.querySelector('.review')?.addEventListener('change',e=>rerender({review:e.target.value}));card.querySelector('.size')?.addEventListener('change',e=>rerender({size:e.target.value,style:''}));card.querySelector('.style')?.addEventListener('change',e=>rerender({style:e.target.value}));card.querySelector('.qty')?.addEventListener('input',e=>{items[i].qty=Math.max(1,num(e.target.value||1));calc()});card.querySelector('.wording')?.addEventListener('input',e=>{items[i].wording=e.target.value;items[i].customText=e.target.value;items[i].custom_text=e.target.value});card.querySelector('.reference')?.addEventListener('input',e=>{items[i].referenceUrl=e.target.value});card.querySelectorAll('.layer').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{const target=e.target,layer=target.dataset.layer,field=target.dataset.field,current=items[i].customization.layers;current[layer][field]=target.value;items[i]=normalizeItem({...items[i],customization:{...items[i].customization,layers:current}});if(target.tagName==='SELECT'){renderItems();calc()}else calc()}))})}
function readCustomer(){return{name:document.getElementById('name')?.value.trim()||'',phone:document.getElementById('phone')?.value.trim()||'',address_line1:document.getElementById('address')?.value.trim()||'',postcode:document.getElementById('postcode')?.value.trim()||'',city:document.getElementById('city')?.value.trim()||'',state:document.getElementById('state')?.value.trim()||''}}
function itemPayload(x){x=normalizeItem(x);const ref=String(x.referenceUrl||'').trim(),custom={...(x.customization||{}),admin_process:x.process,admin_reviewed:true},snap={...(x.product_snapshot||{}),quick_arrange_kind:x.k};if(ref){custom.reference_url=ref;snap.image_url=ref}return{...x,customization:custom,product_snapshot:snap,review_required:x.review==='Need Review'}}
function payload(){const p=D.working_draft||{},delivery=document.getElementById('delivery')?.value||'unknown';return{...p,customer:{...(p.customer||{}),...readCustomer()},items:items.map(itemPayload),date_need:document.getElementById('date')?.value||null,delivery,delivery_fee:DELIVERY[delivery]?.fee||0,combine_with_order_id:document.getElementById('combine')?.value||null}}
function calc(){if(!D)return;items=items.map(normalizeItem);const subtotal=items.reduce((s,x)=>s+itemUnitPrice(x)*Math.max(1,x.qty),0),delivery=document.getElementById('delivery')?.value||'unknown',shipping=DELIVERY[delivery]?.fee||0,total=subtotal+shipping,payment=D.payment_amount==null?null:num(D.payment_amount),difference=payment==null?0:total-payment;[['subtotal',money(subtotal)],['shipping',money(shipping)],['ordertotal',money(total)],['difference',payment==null?'N/A':`${difference>=0?'+':'-'}${money(Math.abs(difference))}`]].forEach(([id,val])=>{const el=document.getElementById(id);if(el)el.textContent=val});const errs=[],warns=[];if(!items.length)errs.push('Tambah sekurang-kurangnya satu produk.');if(delivery==='unknown')errs.push('Pilih Delivery.');if(!document.getElementById('date')?.value)errs.push('Date Need diperlukan.');const ph=String(document.getElementById('phone')?.value||'').replace(/\D/g,'');if(!/^(?:60|0)?1\d{8,9}$/.test(ph))errs.push('Nombor WhatsApp Malaysia tidak sah.');if(total<=0)errs.push('Order total mesti lebih RM0.');if(D.source_type==='qrpay_payment'&&Math.abs(difference)>=.01)errs.push(`Order ${money(total)} mesti sama dengan payment ${money(payment)}.`);const address=document.getElementById('address')?.value.trim()||'';if(delivery!=='pickup'&&delivery!=='unknown'&&!address)warns.push('Alamat belum ada — boleh Confirm/Create Order dahulu dan lengkapkan kemudian sebelum shipping.');const box=document.getElementById('validation');if(box){box.style.display=(errs.length||warns.length)?'block':'none';box.className=`notice ${errs.length?'err':warns.length?'':'ok'}`;box.textContent=[...errs,...warns].join(' ')}document.querySelectorAll('[data-main]').forEach(b=>b.disabled=errs.length>0)}

function events(){return(D.events||[]).slice().reverse().map(x=>`<div class="event"><b>${esc(x.event_type)}</b> · ${esc(x.actor)} · ${new Date(x.created_at).toLocaleString('en-MY',{timeZone:'Asia/Kuala_Lumpur'})}</div>`).join('')||'<div class="muted">No events.</div>'}
function render(){const p=D.working_draft||{},isQr=D.source_type==='qrpay_payment',cash=['cash_counter','cash_at_counter'].includes(D.payment_mode),cands=D.combine_candidates||[],status=String(D.status||'pending_admin').toUpperCase(),paymentLabel=isQr?'Payment Received':cash?'Payment':'Payment Status',paymentValue=isQr?money(D.payment_amount):cash?'Cash at Counter':String(D.payment_status||'unpaid').toUpperCase();items=(p.items||[]).map(normalizeItem);const main=isLocked()?'':isQr?'<button data-main id="confirm" class="btn btn-green">Confirm & Create Order</button>':cash?'<button data-main id="confirm" class="btn btn-green">Confirm Pickup Order</button>':'<button data-main id="approve" class="btn btn-primary">Approve & Send Customer</button>',resend=!isLocked()&&D.admin_approved_at?'<button id="resend" class="btn btn-outline">Resend Customer Link</button>':'';app.innerHTML=`<div class="wrap ${isLocked()?'locked':''}"><div class="page-head"><div><div class="page-label">Admin tool · Draft Engine</div><h1 class="page-title">Order Draft Review</h1><div class="page-sub">Quick Order V1 contract · ${esc(D.source_type||'draft')} · session ${esc(String(D.order_session_id||'-').slice(0,8))}</div></div><span class="status ${D.status==='confirmed'?'done':''}">${esc(status)}</span></div>${D.status==='confirmed'?`<div class="success"><b>✓ Order ${esc(D.order_no||'')} created</b></div>`:''}<div class="grid-2"><div><section class="panel"><div class="panel-header"><div><div class="panel-title">1. Customer & payment</div><div class="panel-subtitle">Draft / WhatsApp / QRPay</div></div></div><div class="panel-body form-stack"><label class="form-field"><span>Nama customer *</span><input id="name" value="${esc(p.customer?.name||D.customer_name||'')}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>No. WhatsApp *</span><input id="phone" value="${esc(p.customer?.phone||D.customer_phone||'')}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Date Need *</span><input id="date" type="date" value="${esc(p.date_need||'')}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Delivery</span><select id="delivery" ${isLocked()?'disabled':''}><option value="unknown">Select...</option>${Object.keys(DELIVERY).map(k=>`<option value="${k}">${DELIVERY[k].label}${DELIVERY[k].fee?` (+${money(DELIVERY[k].fee)})`:''}</option>`).join('')}</select></label><label class="form-field"><span>${paymentLabel}</span><input class="readonly" value="${esc(paymentValue)}" disabled></label><label class="form-field"><span>Customer Status</span><input class="readonly" value="${esc(D.customer_status||'not_sent')}" disabled></label><div id="addressFields"><label class="form-field"><span>Address (optional at draft)</span><textarea id="address" ${isLocked()?'disabled':''}>${esc(p.customer?.address_line1||'')}</textarea></label><div class="row"><label class="form-field"><span>Postcode</span><input id="postcode" value="${esc(p.customer?.postcode||'')}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>City</span><input id="city" value="${esc(p.customer?.city||'')}" ${isLocked()?'disabled':''}></label></div><label class="form-field"><span>State</span><input id="state" value="${esc(p.customer?.state||'')}" ${isLocked()?'disabled':''}></label></div>${cands.length?`<label class="form-field"><span>Combine shipment (optional)</span><select id="combine" ${isLocked()?'disabled':''}><option value="">New shipment</option>${cands.map(o=>`<option value="${o.id}" ${D.combine_with_order_id===o.id?'selected':''}>Ship with ${esc(o.order_no)} · ${esc(o.fulfillment_stage||o.admin_status||o.status)}</option>`).join('')}</select></label>`:'<input id="combine" type="hidden" value="">'}<div id="validation" class="notice" style="display:none"></div></div></section></div><div><section class="panel"><div class="panel-header"><div><div class="panel-title">2. Pilih produk</div><div class="panel-subtitle">Harga ikut variasi V1 yang sedia ada</div></div></div>${isLocked()?'':`<div class="product-picker">${Object.keys(PRODUCTS).map(k=>`<button class="btn btn-outline add-product" data-k="${k}">+ ${esc(PRODUCTS[k].shortLabel)}</button>`).join('')}</div>`}</section><div id="items"></div><section class="total-panel"><div class="total-main"><small>Order Total</small><strong id="ordertotal">RM 0.00</strong></div><div class="total-side"><div class="metric"><small>Subtotal</small><b id="subtotal">RM 0.00</b></div><div class="metric"><small>Shipping</small><b id="shipping">RM 0.00</b></div>${isQr?`<div class="metric"><small>Payment</small><b>${money(D.payment_amount)}</b></div><div class="metric"><small>Difference</small><b id="difference">RM 0.00</b></div>`:''}</div></section></div></div>${isLocked()?'':`<div class="actions"><button id="save" class="btn btn-dark">Save Draft</button>${main}${resend}<button id="reject" class="btn btn-danger">Reject</button></div>`}<section class="panel audit"><details open><summary>Conversation Evidence</summary>${evidence()}</details><details><summary>Audit Log</summary>${events()}</details><details><summary>AI Original</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(D.ai_draft||{},null,2))}</pre></details></section></div>`;document.getElementById('delivery').value=String(p.delivery||'unknown').toLowerCase();document.querySelectorAll('.add-product').forEach(b=>b.onclick=()=>{items.push(newItem(b.dataset.k));renderItems();calc()});['name','phone','date','address','postcode','city','state'].forEach(id=>document.getElementById(id)?.addEventListener('input',calc));document.getElementById('delivery')?.addEventListener('change',calc);if(document.getElementById('save'))document.getElementById('save').onclick=async()=>{try{await api('save',{payload:payload()});toast('Saved');await load()}catch(x){toast(x.message)}};if(document.getElementById('confirm'))document.getElementById('confirm').onclick=async()=>{if(confirm('Create real Order + queue ClickUp?'))try{await api('confirm',{payload:payload()});await load()}catch(x){toast(x.message)}};if(document.getElementById('approve'))document.getElementById('approve').onclick=async()=>{if(confirm('Approve draft dan hantar link kepada customer?'))try{await api('approve_customer',{payload:payload()});toast('Customer link sent');await load()}catch(x){toast(x.message)}};if(document.getElementById('resend'))document.getElementById('resend').onclick=async()=>{try{await api('resend_customer');toast('Customer link resent')}catch(x){toast(x.message)}};if(document.getElementById('reject'))document.getElementById('reject').onclick=async()=>{const reason=prompt('Reason','Not an order');if(reason!==null){try{await api('reject',{reason});await load()}catch(x){toast(x.message)}}};renderItems();calc()}
async function load(){try{const r=await fetch(DATA+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Not found');D=j.draft;render()}catch(x){app.innerHTML=`<div class="wrap"><div class="notice err">${esc(x.message)}</div></div>`}}
if(!/^qrd_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="wrap"><div class="notice err">Invalid draft link.</div></div>';else load();
})();
</script></body></html>
