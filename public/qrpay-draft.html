<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Order Draft Review · iCetak</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.card{background:#fff;border:1px solid #e9e9e9;border-radius:14px;padding:16px;margin:12px 0}.dark{background:#111;color:#fff}.dark small{color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:11px;background:#f7f7f7;border-radius:10px}.stat small{display:block;color:#666}.badge{padding:6px 10px;border-radius:999px;background:#fff2c9;font-size:12px;font-weight:800;height:max-content}.confirmed{background:#dff6e7;color:#176c38}.alert{background:#fff3df;color:#875000;padding:10px;border-radius:9px;margin:10px 0}.ok{background:#e5f7eb;color:#176c38;padding:10px;border-radius:9px;margin:10px 0}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#555}input,select,textarea{width:100%;padding:10px;border:1px solid #d6d6d6;border-radius:9px;font:inherit;background:#fff}textarea{min-height:65px}.item{border:1px solid #e5e5e5;background:#fbfbfb;border-radius:12px;padding:12px;margin:10px 0}.itemhead{display:flex;justify-content:space-between}.itemgrid{display:grid;grid-template-columns:1fr 1.5fr .55fr .7fr;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}.black{background:#111;color:#fff}.green{background:#16864b;color:#fff}.blue{background:#1769d1;color:#fff}.soft{background:#eef1f5}.red{background:#fff0f0;color:#a72b2b}.mini{padding:5px 8px;border:1px solid #ddd;background:#fff;border-radius:7px}.actions{position:sticky;bottom:5px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fffffff2;border:1px solid #ddd;border-radius:12px}.muted{color:#777;font-size:13px}.event{padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.msg{padding:8px;border-radius:9px;margin:6px 0;font-size:12px;max-width:88%}.cust{background:#e8f7ed;margin-left:auto}.shop{background:#f0f1f3}.toast{position:fixed;right:15px;top:15px;background:#111;color:#fff;padding:12px;border-radius:10px;z-index:9}.locked input,.locked select,.locked textarea{background:#eee}@media(max-width:700px){.grid,.stats,.itemgrid,.row2{grid-template-columns:1fr}.wrap{padding:9px}}</style></head><body><div id="app"><div class="wrap"><p>Loading draft…</p></div></div><script>(()=>{const DATA='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-data',ACTION='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-review',token=new URLSearchParams(location.search).get('token')||'',app=document.getElementById('app'),types=['printed','edible','acrylic','wafer','burnaway','mirror'];let D=null,items=[];const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>Number.isFinite(Number(v))?Number(v):0,m=v=>'RM'+n(v).toFixed(2),locked=()=>['confirmed','rejected'].includes(D?.status);function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2600)}async function api(action,extra={}){const r=await fetch(ACTION,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Action failed');return j}function item(x,i){return `<div class="item"><div class="itemhead"><b>Item ${i+1}</b>${locked()?'':`<button class="mini rm" data-i="${i}">Remove</button>`}</div><div class="itemgrid"><label>Product<select class="k" ${locked()?'disabled':''}>${types.map(k=>`<option ${((x.k||x.product_type)===k)?'selected':''}>${k}</option>`).join('')}</select></label><label>Title / Theme<input class="title" value="${e(x.title||'')}" ${locked()?'disabled':''}></label><label>Qty<input class="qty" type="number" min="1" value="${Math.max(1,n(x.qty||1))}" ${locked()?'disabled':''}></label><label>Unit Price<input class="price" type="number" min="0" step=".01" value="${n(x.price||0)}" ${locked()?'disabled':''}></label></div><div class="row2"><label>Size<input class="size" value="${e(x.size||'')}" ${locked()?'disabled':''}></label><label>Style / Shape / Color<input class="style" value="${e(x.style||'')}" ${locked()?'disabled':''}></label></div><label>Wording<textarea class="wording" ${locked()?'disabled':''}>${e(x.wording||x.custom_text||'')}</textarea></label></div>`}function readItems(){document.querySelectorAll('.item').forEach((r,i)=>{const o=items[i]||{},w=r.querySelector('.wording').value.trim(),k=r.querySelector('.k').value;items[i]={...o,k,product_type:k,title:r.querySelector('.title').value.trim(),qty:Math.max(1,n(r.querySelector('.qty').value)),price:n(r.querySelector('.price').value),size:r.querySelector('.size').value.trim(),style:r.querySelector('.style').value.trim(),wording:w,custom_text:w,review:'Need Review',review_required:true,customization:{...(o.customization||{}),admin_reviewed:true}}});calc()}function renderItems(){document.getElementById('items').innerHTML=items.length?items.map(item).join(''):'<div class="alert">Tiada item.</div>';document.querySelectorAll('.item input,.item select,.item textarea').forEach(x=>x.oninput=readItems);document.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{items.splice(Number(x.dataset.i),1);renderItems()});calc()}function calc(){if(!D)return;const sub=items.reduce((s,x)=>s+n(x.price)*Math.max(1,n(x.qty)),0),ship=n(document.getElementById('fee')?.value),total=sub+ship,pay=D.payment_amount==null?null:n(D.payment_amount),diff=pay==null?0:total-pay;for(const [id,v] of [['sub',m(sub)],['ship',m(ship)],['total',m(total)],['diff',pay==null?'N/A':(diff>=0?'+':'-')+m(Math.abs(diff))]]){const el=document.getElementById(id);if(el)el.textContent=v}const errs=[];if(!items.length)errs.push('Tambah item.');const del=document.getElementById('delivery')?.value||'unknown';if(del==='unknown')errs.push('Pilih Shipping / Pickup.');if(del!=='pickup'&&del!=='unknown'&&!document.getElementById('address')?.value.trim())errs.push('Alamat courier wajib.');if(!document.getElementById('date')?.value)errs.push('Date Need wajib.');const ph=String(document.getElementById('phone')?.value||'').replace(/\D/g,'');if(!/^(?:60|0)?1\d{8,9}$/.test(ph))errs.push('WhatsApp tak sah.');if(D.source_type==='qrpay_payment'&&Math.abs(diff)>=.01)errs.push('Total mesti sama dengan payment received.');if(total<=0)errs.push('Total mesti lebih RM0.');const v=document.getElementById('validation');if(v){v.style.display=errs.length?'block':'none';v.textContent=errs.join(' ')}document.querySelectorAll('[data-main]').forEach(b=>b.disabled=errs.length>0)}function payload(){readItems();const p=D.working_draft||{};return {...p,customer:{...(p.customer||{}),name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address_line1:document.getElementById('address').value.trim(),postcode:document.getElementById('postcode').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim()},items,date_need:document.getElementById('date').value||null,delivery:document.getElementById('delivery').value,delivery_fee:n(document.getElementById('fee').value),combine_with_order_id:document.getElementById('combine')?.value||null}}function evidence(){const ms=D.evidence?.messages||D.working_draft?.evidence?.messages||[];return ms.map(x=>`<div class="msg ${x.direction==='inbound'?'cust':'shop'}"><b>${x.direction==='inbound'?'CUSTOMER':'SELLER'}</b><div>${e(x.text||'['+(x.type||'message')+']')}</div></div>`).join('')||'<div class="muted">No evidence.</div>'}function events(){return (D.events||[]).slice().reverse().map(x=>`<div class="event"><b>${e(x.event_type)}</b> · ${e(x.actor)} · ${new Date(x.created_at).toLocaleString('en-MY',{timeZone:'Asia/Kuala_Lumpur'})}</div>`).join('')||'<div class="muted">No events.</div>'}function render(){const p=D.working_draft||{},isQr=D.source_type==='qrpay_payment',cash=['cash_counter','cash_at_counter'].includes(D.payment_mode),payLabel=isQr?'Payment Received':cash?'Payment Mode':'Payment Status',payValue=isQr?m(D.payment_amount):cash?'Cash at Counter':String(D.payment_status||'unpaid').toUpperCase(),cands=D.combine_candidates||[],main=locked()?'':isQr?'<button data-main id="confirm" class="btn green">Confirm & Create Order</button>':cash?'<button data-main id="confirm" class="btn green">Confirm Pickup Order</button>':'<button data-main id="approve" class="btn blue">Approve & Send Customer</button>',resend=!locked()&&D.admin_approved_at?'<button id="resend" class="btn soft">Resend Customer Link</button>':'';items=structuredClone(p.items||[]);app.innerHTML=`<div class="wrap ${locked()?'locked':''}"><div class="top"><div><small>ICETAK · ADMIN DRAFT ENGINE</small><h2 style="margin:3px 0">Order Draft Review</h2><div class="muted">Source: <b>${e(D.source_type||'qrpay_payment')}</b> · Session: ${e(String(D.order_session_id||'-').slice(0,8))}</div></div><span class="badge ${D.status==='confirmed'?'confirmed':''}">${e(String(D.status).toUpperCase())}</span></div><section class="card dark"><div class="grid"><div><small>${payLabel}</small><h2>${e(payValue)}</h2></div><div><small>Reference</small><b>${e(D.transaction_id||D.request_key||'Draft')}</b></div></div></section>${D.status==='confirmed'?`<section class="card ok"><b>✅ Order created: ${e(D.order_no||'')}</b></section>`:''}<section class="card"><h3>Customer & Date</h3><div class="grid"><label>Name<input id="name" value="${e(p.customer?.name||D.customer_name||'')}" ${locked()?'disabled':''}></label><label>WhatsApp<input id="phone" value="${e(p.customer?.phone||D.customer_phone||'')}" ${locked()?'disabled':''}></label><label>Date Need<input id="date" type="date" value="${e(p.date_need||'')}" ${locked()?'disabled':''}></label><label>Customer Status<input value="${e(D.customer_status||'not_sent')}" disabled></label></div></section><section class="card"><h3>Shipping / Pickup</h3><div class="grid"><label>Method<select id="delivery" ${locked()?'disabled':''}><option value="unknown">-- Select --</option><option value="pickup">Pickup</option><option value="spx">SPX</option><option value="jnt">J&T</option><option value="ninja">Ninja Van</option></select></label><label>Fee<input id="fee" type="number" step=".01" value="${n(p.delivery_fee??D.shipping_fee)}" ${locked()?'disabled':''}></label><label>Address<input id="address" value="${e(p.customer?.address_line1||'')}" ${locked()?'disabled':''}></label><label>Postcode<input id="postcode" value="${e(p.customer?.postcode||'')}" ${locked()?'disabled':''}></label><label>City<input id="city" value="${e(p.customer?.city||'')}" ${locked()?'disabled':''}></label><label>State<input id="state" value="${e(p.customer?.state||'')}" ${locked()?'disabled':''}></label></div>${cands.length?`<div style="margin-top:12px"><label>Combine shipment (optional)<select id="combine" ${locked()?'disabled':''}><option value="">New shipment</option>${cands.map(o=>`<option value="${o.id}" ${D.combine_with_order_id===o.id?'selected':''}>Ship with ${e(o.order_no)} · ${e(o.fulfillment_stage||o.admin_status||o.status)}${o.tracking?' · AWB '+e(o.tracking):''}</option>`).join('')}</select></label><div class="muted">Order kekal berasingan; fulfillment sahaja digroup.</div></div>`:'<input id="combine" type="hidden" value="">'}</section><section class="card"><div class="itemhead"><h3>Items</h3>${locked()?'':'<button id="add" class="btn soft">+ Add Item</button>'}</div><div id="items"></div></section><section class="card"><h3>Total</h3><div class="stats"><div class="stat"><small>Subtotal</small><b id="sub"></b></div><div class="stat"><small>Shipping</small><b id="ship"></b></div><div class="stat"><small>Draft Total</small><b id="total"></b></div><div class="stat"><small>Vs Payment</small><b id="diff"></b></div></div><div id="validation" class="alert" style="display:none"></div></section>${locked()?'':`<div class="actions"><button id="save" class="btn black">Save Draft</button>${main}${resend}<button id="reject" class="btn red">Reject</button></div>`}<section class="card"><details open><summary>Conversation Evidence</summary>${evidence()}</details><details><summary>Audit Log</summary>${events()}</details><details><summary>AI Original</summary><pre style="white-space:pre-wrap;font-size:11px">${e(JSON.stringify(D.ai_draft||{},null,2))}</pre></details></section></div>`;document.getElementById('delivery').value=p.delivery||'unknown';['fee','date','phone','address'].forEach(id=>document.getElementById(id).oninput=calc);document.getElementById('delivery').onchange=x=>{const map={pickup:0,spx:4.5,jnt:5.9,ninja:6.9,unknown:0};if(n(document.getElementById('fee').value)===0||x.target.value==='pickup')document.getElementById('fee').value=map[x.target.value]??0;calc()};if(document.getElementById('add'))document.getElementById('add').onclick=()=>{items.push({k:'printed',product_type:'printed',title:'Cake Topper',qty:1,price:0,size:'',style:'',wording:'',review:'Need Review',review_required:true,customization:{admin_added:true}});renderItems()};if(document.getElementById('save'))document.getElementById('save').onclick=async()=>{try{await api('save',{payload:payload()});await load();toast('Saved')}catch(x){toast(x.message)}};if(document.getElementById('confirm'))document.getElementById('confirm').onclick=async()=>{if(confirm('Create real Order + queue ClickUp?'))try{await api('confirm',{payload:payload()});await load()}catch(x){toast(x.message)}};if(document.getElementById('approve'))document.getElementById('approve').onclick=async()=>{if(confirm('Approve draft dan hantar link kepada customer?'))try{const r=await api('approve_customer',{payload:payload()});toast('Customer link sent');await load()}catch(x){toast(x.message)}};if(document.getElementById('resend'))document.getElementById('resend').onclick=async()=>{try{await api('resend_customer');toast('Customer link resent')}catch(x){toast(x.message)}};if(document.getElementById('reject'))document.getElementById('reject').onclick=async()=>{const reason=prompt('Reason','Not an order');if(reason!==null){await api('reject',{reason});await load()}};renderItems()}async function load(){try{const r=await fetch(DATA+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Not found');D=j.draft;render()}catch(x){app.innerHTML='<div class="wrap"><div class="alert">'+e(x.message)+'</div></div>'}}load()})();</script></body></html>
