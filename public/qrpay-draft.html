<script>
(()=>{
const DATA='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-data';
const ACTION='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/qrpay-draft-review';
const MANUAL_PAID='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/order-draft-manual-paid';
const ADDRESS_FETCH='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/draft-address-fetch';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.getElementById('app');
const PRODUCTS={
 edible:{label:'Edible Image',shortLabel:'Edible',process:['Pre-order','Urgent'],sizes:['3 inch','3.5 inch','4 inch','4.5 inch','5 inch','5.5 inch','6 inch','6.5 inch','7 inch','7.5 inch','A6','A5','A4','Cupcake'],styles:['Round / Bulat','Square / Petak','Love Shape / Hati','Full Landscape','Full Portrait','Custom'],defaultSize:'3 inch',defaultStyle:'Round / Bulat',defaultReview:'No Review'},
 burnaway:{label:'Burn Away Combo',shortLabel:'Burn Away',process:['Pre-order','Urgent'],sizes:['3 inch','4 inch','5 inch','5.5 inch','6 inch','6.5 inch','7 inch','7.5 inch','Custom A5','Custom A4'],styles:['Round / Bulat','Square / Petak','Love Shape / Hati'],defaultSize:'5 inch',defaultStyle:'Round / Bulat',defaultReview:'No Review'},
 wafer:{label:'Wafer Paper Only',shortLabel:'Wafer',process:['Pre-order','Urgent'],sizes:['3 inch','3.5 inch','4 inch','4.5 inch','5 inch','5.5 inch','6 inch','6.5 inch','7 inch','7.5 inch','8 inch','A6','A5','A4'],styles:['Round / Bulat','Square / Petak','Love Shape / Hati'],defaultSize:'3 inch',defaultStyle:'Round / Bulat',defaultReview:'No Review'},
 printed:{label:'Cake Topper',shortLabel:'Topper',process:['Pre-order'],sizes:['1 pc'],styles:['Custom Name','Happy Birthday'],defaultSize:'1 pc',defaultStyle:'Happy Birthday',defaultReview:'Need Review'},
 mirror:{label:'Mirror Gold Artpaper',shortLabel:'Mirror Gold',process:['Pre-order','Urgent'],sizes:['A7 Mini','A6 Standard','A5 Large'],styles:['Gold'],defaultSize:'A7 Mini',defaultStyle:'Gold',defaultReview:'No Review'},
 acrylic:{label:'Acrylic Cake Topper',shortLabel:'Acrylic',process:['Pre-order','Urgent'],sizes:['A7 Mini','A6 Standard','A5 Large'],styles:['Gold','Silver','Black','Rose Gold','Clear / Transparent','Dark Blue','Light Blue','Red','Yellow','Pink','Gold Glitter','Silver Glitter','Lilac / Light Purple','Mirror Blue','Bronze','Green','Orange','White'],defaultSize:'A7 Mini',defaultStyle:'Gold',defaultReview:'No Review'}
};
const DELIVERY={pickup:{label:'Pickup',fee:0},spx:{label:'Pos SPX',fee:4.5},jnt:{label:'J&T',fee:5.9},ninja:{label:'Ninja Van',fee:6.9}};
let D=null,items=[],addressFetching=false,autoAddressAttempted=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>'RM '+num(v).toFixed(2);
const isLocked=()=>['confirmed','rejected'].includes(String(D?.status||''));
const whatsappIdentity=()=>D?.working_draft?.whatsapp_identity||D?.evidence?.whatsapp_identity||{};
function whatsappIdentityLinks(phone){const identity=whatsappIdentity(),number=String(phone||identity.phone||'').replace(/\D/g,''),username=String(identity.username||'').replace(/^@+/,'');let html='<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:12px">';if(number)html+=`<a href="tel:${esc(number)}" style="color:#175cd3">☎ ${esc(number)}</a><a href="https://wa.me/${esc(number)}" target="_blank" rel="noreferrer" style="color:#175cd3">WhatsApp</a>`;if(username)html+=`<span style="color:#175cd3">@${esc(username)}</span>`;if(identity.bsuid)html+=`<span style="color:#667085">ID: ${esc(identity.bsuid)}</span>`;if(!number&&identity.bsuid)html+='<span style="color:#667085">Phone tidak dikongsi</span>';return html+'</div>'}
const nullableMoney=v=>(v===null||v===undefined||v==='')?null:Math.max(0,num(v));
function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),3000)}
function kind(v){let k=String(v||'').toLowerCase();if(k==='topper'||k==='cake_topper')k='printed';return PRODUCTS[k]?k:'edible'}
function stylesFor(k,size){if(k==='edible'&&['4 inch','4.5 inch','5 inch','5.5 inch'].includes(size))return['Round / Bulat','Square / Petak','Love Shape / Hati','Custom'];return PRODUCTS[k].styles}
function sizeNorm(k,v){const cfg=PRODUCTS[k],raw=String(v||'').trim();if(cfg.sizes.includes(raw))return raw;if(k==='mirror'||k==='acrylic'){const u=raw.toUpperCase();if(u==='A7')return'A7 Mini';if(u==='A6')return'A6 Standard';if(u==='A5')return'A5 Large'}if(k==='printed')return'1 pc';const m=raw.match(/(\d+(?:\.\d+)?)\s*(?:inch|in|inci|\")?/i);if(m){const x=`${Number(m[1])} inch`;if(cfg.sizes.includes(x))return x}const u=raw.toUpperCase();return cfg.sizes.find(x=>x.toUpperCase()===u)||cfg.defaultSize}
function styleNorm(k,size,v){const list=stylesFor(k,size),raw=String(v||'').trim();if(list.includes(raw))return raw;const l=raw.toLowerCase();if(/round|bulat/.test(l)&&list.includes('Round / Bulat'))return'Round / Bulat';if(/square|petak/.test(l)&&list.includes('Square / Petak'))return'Square / Petak';if(/love|hati|heart/.test(l)&&list.includes('Love Shape / Hati'))return'Love Shape / Hati';if(/landscape/.test(l)&&list.includes('Full Landscape'))return'Full Landscape';if(/portrait/.test(l)&&list.includes('Full Portrait'))return'Full Portrait';return list.find(x=>x.toLowerCase()===l)||list[0]||PRODUCTS[k].defaultStyle}
function unitPrice(k,process,size,style,review){if(k==='printed')return 10;if(k==='mirror')return process==='Urgent'?18:15;if(k==='acrylic'){if(process==='Urgent')return size==='A7 Mini'?15:size==='A6 Standard'?25:40;return size==='A7 Mini'?12:size==='A6 Standard'?20:35}if(k==='burnaway'){if(size.includes('A4'))return 36;if(size.includes('A5'))return 18;const n=parseFloat(size)||0;return n>=6?30:n>=5?18:12}if(k==='wafer'){const base=size==='A4'?12:size==='A5'||size==='A6'?6:(parseFloat(size)||0)<=6?6:12;return base+(process==='Urgent'&&review==='Need Review'?2:0)}let base;if(size==='A4'||size==='Cupcake')base=24;else if(size==='A5')base=12;else if(size==='A6')base=6;else{const n=parseFloat(size)||0;base=style==='Square / Petak'&&size==='4 inch'?12:n>=6?24:n>=4.5?12:6}if(process==='Urgent'&&review==='Need Review')return base===6?7:base===12?14:base===24?28:base;return base}
function burnawayLayers(raw={}){const c=raw.customization||{},ls=c.layers||{},fallbackSize=sizeNorm('edible',raw.size),fallbackShape=styleNorm('edible',fallbackSize,raw.style),layer=(k,defaultSize)=>{const x=ls[k]||{},size=sizeNorm(k,x.size||defaultSize),shape=styleNorm(k,size,x.shape||x.style||fallbackShape);return{size,shape,wording:String(x.wording||raw.wording||raw.customText||'').trim(),referenceUrl:String(x.referenceUrl||x.reference_url||c.reference_url||'').trim()}};return{edible:layer('edible',fallbackSize),wafer:layer('wafer',sizeNorm('wafer',raw.size))}}
function itemUnitPrice(item){if(item.k!=='burnaway')return unitPrice(item.k,item.process,item.size,item.style,item.review);const l=item.customization?.layers||burnawayLayers(item);return unitPrice('edible','Pre-order',l.edible.size,l.edible.shape,'No Review')+unitPrice('wafer','Pre-order',l.wafer.size,l.wafer.shape,'No Review')}
function normalizeItem(raw={}){const k=kind(raw.k||raw.kind||raw.product_type),cfg=PRODUCTS[k];let process=String(raw.process||'').trim();if(!cfg.process.includes(process))process=/urgent/i.test(process)?'Urgent':cfg.process[0];let review=String(raw.review||'').trim();if(!['No Review','Need Review'].includes(review))review=(raw.review_required||raw.reviewRequired)?'Need Review':cfg.defaultReview;const rawSize=sizeNorm(k,raw.size),rawStyle=styleNorm(k,rawSize,raw.style),wording=String(raw.customText||raw.custom_text||raw.wording||'').trim(),referenceUrl=String(raw.referenceUrl||raw.reference_url||raw.customization?.reference_url||raw.product_snapshot?.image_url||'').trim(),layers=k==='burnaway'?burnawayLayers(raw):null,customization=layers?{...(raw.customization||{}),layers}:raw.customization,customItem=Boolean(raw.is_custom_item||customization?.manual_custom_item);const item={...raw,k,kind:k,product_type:k,title:customItem&&String(raw.title||'').trim()?String(raw.title).trim():cfg.label,is_custom_item:customItem,process,review,review_required:review==='Need Review',size:layers?`Edible ${layers.edible.size} • Wafer ${layers.wafer.size}`:rawSize,style:layers?`Edible ${layers.edible.shape} • Wafer ${layers.wafer.shape}`:rawStyle,qty:Math.max(1,num(raw.qty||1)),wording,customText:wording,custom_text:wording,referenceUrl,customization};const catalog=itemUnitPrice(item),deal=nullableMoney(raw.seller_deal_price),reason=String(raw.price_reason||raw.customization?.pricing?.price_reason||'').trim();return{...item,catalog_price:catalog,seller_deal_price:deal,price_reason:reason,price:deal===null?catalog:deal}}
function newItem(k){return normalizeItem({k,qty:1,customization:{admin_added:true}})}
async function api(action,extra={}){const r=await fetch(ACTION,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Action failed');return j}
async function manualPaid(payment_method,reference){const r=await fetch(MANUAL_PAID,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,payment_method,reference})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Manual payment confirmation failed');return j}
function setAddressFetchBusy(busy,message='',kind=''){
  addressFetching=busy;
  const button=document.getElementById('fetchAddress');
  const pickup=document.getElementById('delivery')?.value==='pickup';
  if(button){button.disabled=busy||pickup||isLocked();button.textContent=busy?'Mencari alamat…':'Cari Alamat Customer'}
  ['name','phone','address','postcode','city','state'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=busy||isLocked()});
  ['save','reject','resend'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=busy});
  document.querySelectorAll('[data-main]').forEach(el=>{if(busy)el.disabled=true});
  const status=document.getElementById('addressFetchStatus');
  if(status){status.textContent=message;status.className='address-fetch-status '+kind}
  if(!busy)calc();
}
function completeAddressFields(){
  const address=document.getElementById('address')?.value.trim()||'',postcode=document.getElementById('postcode')?.value.trim()||'',city=document.getElementById('city')?.value.trim()||'',state=document.getElementById('state')?.value.trim()||'';
  return address.replace(/[^\p{L}\p{N}]/gu,'').length>=3&&/^\d{5}$/.test(postcode.replace(/\D/g,''))&&city.replace(/[^\p{L}\p{N}]/gu,'').length>=2&&state.replace(/[^\p{L}\p{N}]/gu,'').length>=2;
}
async function fetchDraftAddress(options={}){
  const automatic=options?.automatic===true;
  const phone=document.getElementById('phone')?.value.trim()||'';
  if(!phone){toast('Isi nombor WhatsApp dahulu');return}
  setAddressFetchBusy(true,'Mencari Customer CRM, kemudian ClickUp…');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);
  let finalMessage='',finalKind='';
  try{
    const response=await fetch(ADDRESS_FETCH,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,phone}),signal:controller.signal});
    const result=await response.json().catch(()=>({}));
    if(!response.ok||result.ok===false)throw Error(result.error||'Gagal ambil alamat');
    if(result.found!==true){finalMessage='Alamat tidak dijumpai dalam Customer CRM atau ClickUp.';finalKind='err';if(!automatic)toast(finalMessage);return}
    const customer=result.customer||{},address=result.address||{};
    const values={name:customer.name||'',phone:customer.phone||phone,address:address.address_line1||'',postcode:address.postcode||'',city:address.city||'',state:address.state||''};
    Object.entries(values).forEach(([id,value])=>{const el=document.getElementById(id);if(el&&value)el.value=String(value)});
    D.working_draft={...(D.working_draft||{}),customer:{...(D.working_draft?.customer||{}),name:values.name,phone:values.phone,address_line1:values.address,address_line2:address.address_line2||'',postcode:values.postcode,city:values.city,state:values.state,address_id:address.id||null},address_evidence:{...(D.working_draft?.address_evidence||{}),source:result.source==='customer_crm'?'customer_crm':'clickup_webhook',address_id:address.id||null,saved_address_verified:Boolean(address.is_verified)}};
    if(result.draft_version)D.version=result.draft_version;
    finalMessage=result.source==='customer_crm'?'Alamat Customer CRM dimasukkan dan disimpan.':'Alamat ClickUp dimasukkan dan disimpan.';
    finalKind='ok';
    if(!automatic)toast(finalMessage);
  }catch(error){
    finalMessage=error?.name==='AbortError'?'Carian alamat tamat masa. Cuba lagi.':(error?.message||'Gagal ambil alamat');
    finalKind='err';
    toast(finalMessage);
  }finally{
    clearTimeout(timer);
    setAddressFetchBusy(false,finalMessage,finalKind);
  }
}
function maybeAutoFetchAddress(){
  const delivery=document.getElementById('delivery')?.value||'unknown',phone=document.getElementById('phone')?.value.trim()||'';
  if(autoAddressAttempted||addressFetching||isLocked()||delivery==='pickup'||delivery==='unknown'||!phone||completeAddressFields())return;
  autoAddressAttempted=true;
  fetchDraftAddress({automatic:true});

ding direkod berasingan</div></div></div><div class="pricing-grid"><label class="form-field"><span>Custom Add-on +RM</span><input id="customAddon" type="number" min="0" step="0.01" value="${num(pa.custom_addon)||''}" ${isLocked()?'disabled':''}></label><label class="form-field wide2"><span>Add-on reason</span><input id="customAddonReason" value="${esc(pa.custom_addon_reason||'')}" placeholder="contoh: extra custom design" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Discount type</span><select id="discountType" ${isLocked()?'disabled':''}><option value="amount" ${pa.discount_type!=='percent'?'selected':''}>RM</option><option value="percent" ${pa.discount_type==='percent'?'selected':''}>%</option></select></label><label class="form-field"><span>Discount value</span><input id="discountValue" type="number" min="0" step="0.01" value="${num(pa.discount_value)||''}" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Discount reason</span><input id="discountReason" value="${esc(pa.discount_reason||'')}" placeholder="optional" ${isLocked()?'disabled':''}></label><label class="form-field"><span>Rounding +/- RM</span><input id="rounding" type="number" step="0.01" value="${num(pa.rounding)||''}" placeholder="contoh -0.50" ${isLocked()?'disabled':''}></label><label class="form-field wide2"><span>Rounding reason</span><input id="roundingReason" value="${esc(pa.rounding_reason||'')}" placeholder="optional" ${isLocked()?'disabled':''}></label></div></section><section class="total-panel"><div class="total-main"><small>Order Total</small><strong id="ordertotal">RM 0.00</strong><div class="catalog-total">Catalog items: <span id="catalogsubtotal">RM 0.00</span></div></div><div class="total-side"><div class="metric"><small>Items</small><b id="subtotal">RM 0.00</b></div><div class="metric"><small>Add-on</small><b id="addonmetric">RM 0.00</b></div><div class="metric"><small>Discount</small><b id="discountmetric">RM 0.00</b></div><div class="metric"><small>Shipping</small><b id="shipping">RM 0.00</b></div><div class="metric"><small>Rounding</small><b id="roundingmetric">RM 0.00</b></div>${isQr?`<div class="metric"><small>Difference</small><b id="difference">RM 0.00</b></div>`:''}</div></section></div></div>${isLocked()?'':`<div class="actions"><button id="save" class="btn btn-dark">Save Draft</button>${main}${paidButton}${resend}<button id="reject" class="btn btn-danger">Reject</button></div>`}<section class="panel audit"><details open><summary>Conversation Evidence</summary>${evidence()}</details><details><summary>Audit Log</summary>${events()}</details><details><summary>AI Original</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(D.ai_draft||{},null,2))}</pre></details></section></div>`;
document.getElementById('delivery').value=String(p.delivery||'unknown').toLowerCase();document.querySelectorAll('.add-product').forEach(b=>b.onclick=()=>{items.push(newItem(b.dataset.k));renderItems();calc()});['name','phone','date','address','postcode','city','state','customAddon','customAddonReason','discountValue','discountReason','rounding','roundingReason'].forEach(id=>document.getElementById(id)?.addEventListener('input',calc));document.getElementById('delivery')?.addEventListener('change',()=>setAddressFetchBusy(false,document.getElementById('addressFetchStatus')?.textContent||'',document.getElementById('addressFetchStatus')?.classList.contains('err')?'err':document.getElementById('addressFetchStatus')?.classList.contains('ok')?'ok':''));document.getElementById('fetchAddress')?.addEventListener('click',fetchDraftAddress);document.getElementById('discountType')?.addEventListener('change',calc);if(document.getElementById('save'))document.getElementById('save').onclick=async()=>{try{await api('save',{payload:payload()});toast('Saved');await load()}catch(x){toast(x.message)}};if(document.getElementById('confirm'))document.getElementById('confirm').onclick=()=>reviewAction('confirm');if(document.getElementById('approve'))document.getElementById('approve').onclick=()=>reviewAction('approve');if(document.getElementById('confirmPaid'))document.getElementById('confirmPaid').onclick=()=>reviewAction('confirmPaid');if(document.getElementById('resend'))document.getElementById('resend').onclick=async()=>{try{await api('resend_customer');toast('Customer link resent')}catch(x){toast(x.message)}};if(document.getElementById('reject'))document.getElementById('reject').onclick=async()=>{const reason=prompt('Reason','Not an order');if(reason!==null){try{await api('reject',{reason});await load()}catch(x){toast(x.message)}}};renderItems();calc()}
app.addEventListener('click',event=>{const button=event.target.closest('#confirmSend');if(!button||button.disabled)return;reviewAction('confirmSend')});
async function load(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(DATA+'?token='+encodeURIComponent(token),{cache:'no-store',signal:controller.signal}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Not found');D=j.draft;render();setAddressFetchBusy(false);queueMicrotask(maybeAutoFetchAddress)}catch(x){const message=x?.name==='AbortError'?'Loading draft mengambil masa terlalu lama. Sila refresh atau cuba semula.':x.message;app.innerHTML=`<div class="wrap"><div class="notice err">${esc(message)}</div></div>`}finally{clearTimeout(timer)}}
if(!/^qrd_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="wrap"><div class="notice err">Invalid draft link.</div></div>';else load();
})();
</script></body></html>
