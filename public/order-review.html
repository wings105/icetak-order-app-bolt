<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Semak Order · DecoCake.my</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:Inter,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:14px}.brand{font-size:12px;font-weight:900;letter-spacing:.06em}.card{background:#fff;border:1px solid #e9e9e9;border-radius:15px;padding:16px;margin:12px 0}.hero{background:#111;color:#fff}.hero small{color:#aaa}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff3cd;color:#745c00;font-size:12px;font-weight:800}.green{background:#e3f7ea;color:#146b36}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.itemtop{display:flex;justify-content:space-between;gap:12px}.muted{color:#777;font-size:13px}.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.total{font-size:21px;font-weight:900;border-top:1px solid #ddd;margin-top:7px;padding-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#555}input,textarea{width:100%;padding:10px;border:1px solid #d5d5d5;border-radius:9px;font:inherit}textarea{min-height:68px}.btn{width:100%;border:0;border-radius:11px;padding:13px 15px;font-weight:900;font-size:15px;cursor:pointer;margin:5px 0}.confirm{background:#148b4b;color:#fff}.soft{background:#eef1f5;color:#222}.red{background:#fff0f0;color:#a72b2b}.paybox{text-align:center}.qr{display:block;width:min(340px,90%);height:auto;margin:12px auto;border-radius:12px;border:1px solid #ddd}.amount{font-size:34px;font-weight:950;margin:6px 0}.count{font-weight:800}.alert{padding:11px;border-radius:10px;background:#fff2dd;color:#875000;margin:10px 0}.success{padding:13px;border-radius:11px;background:#e5f8ec;color:#146b36;margin:10px 0}.spinner{padding:60px 20px;text-align:center;color:#777}a{color:#075dc2}.toast{position:fixed;right:14px;top:14px;background:#111;color:#fff;padding:12px;border-radius:10px;z-index:9}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:9px}}</style></head><body><div id="app"><div class="spinner">Loading order…</div></div><script>(()=>{const API='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/order-draft-customer',token=new URLSearchParams(location.search).get('token')||'',app=document.getElementById('app');let D=null,timer=null;const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>Number.isFinite(Number(v))?Number(v):0,m=v=>'RM'+n(v).toFixed(2);function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2400)}async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Request failed');return j}async function load(silent=false){try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Order not found');D=j.draft;render();schedule()}catch(x){if(!silent)app.innerHTML='<div class="wrap"><div class="alert">'+e(x.message)+'</div></div>'}}function layerLines(x){const l=x.customization?.layers;if(!l)return (x.size?e(x.size)+' · ':'')+(x.style?e(x.style):'');return `<b>Edible:</b> ${e(l.edible?.size||'-')} · ${e(l.edible?.shape||'-')}<br><b>Wafer:</b> ${e(l.wafer?.size||'-')} · ${e(l.wafer?.shape||'-')}`}function items(){return (D.working_draft?.items||[]).map((x,i)=>`<div class="item"><div class="itemtop"><div><b>${i+1}. ${e(x.title||x.product_type||'Item')}</b><div class="muted">${layerLines(x)}</div></div><b>x${Math.max(1,n(x.qty))} · ${m(n(x.price)*Math.max(1,n(x.qty)))}</b></div>${x.wording?`<div style="margin-top:8px"><small>Wording</small><br><b>${e(x.wording).replace(/\n/g,'<br>')}</b></div>`:''}</div>`).join('')||'<div class="alert">Item belum tersedia.</div>'}function customerFields(){const c=D.working_draft?.customer||{},needsAddress=String(D.working_draft?.delivery||'').toLowerCase()!=='pickup'&&!String(c.address_line1||'').trim();return `${needsAddress?'<div class="alert"><b>Alamat belum ada.</b><br>Sila isi alamat sebelum Confirm Order & payment.</div>':''}<div class="grid"><label>Name<input id="name" value="${e(c.name||D.customer_name||'')}"></label><label>WhatsApp<input id="phone" value="${e(c.phone||D.customer_phone||'')}"></label><label style="grid-column:1/-1">Address<textarea id="address">${e(c.address_line1||'')}</textarea></label><label>Postcode<input id="postcode" value="${e(c.postcode||'')}"></label><label>City<input id="city" value="${e(c.city||'')}"></label><label>State<input id="state" value="${e(c.state||'')}"></label></div>`}function payPanel(){const ps=D.payment_session;if(D.order){return `<section class="card"><div class="success"><b>✅ Payment received & order confirmed</b><div style="margin-top:5px">Order: <b>${e(D.order.order_no||D.order_no||'')}</b></div></div>${D.order.public_token?`<a class="btn soft" style="display:block;text-align:center;text-decoration:none" href="/?order=${encodeURIComponent(D.order.public_token)}">Open Order</a>`:''}</section>`}if(D.customer_status==='change_requested')return `<section class="card"><div class="alert"><b>Correction requested.</b><br>Seller akan semak semula detail order. Payment belum perlu dibuat.</div></section>`;if(!['confirmed','awaiting_payment'].includes(D.customer_status)&&D.payment_required)return'';if(!D.payment_required)return `<section class="card"><div class="success"><b>✅ Order confirmed.</b><br>Payment: ${e(D.payment_mode==='cash_counter'?'Cash at Counter':D.payment_status)}</div></section>`;if(!ps)return `<section class="card"><button id="prepare" class="btn confirm">Generate Payment</button></section>`;const exp=ps.expires_at?new Date(ps.expires_at).getTime():0,remain=Math.max(0,Math.floor((exp-Date.now())/1000)),matched=ps.status==='matched'||D.payment_status==='paid';if(matched)return `<section class="card paybox"><div class="success"><b>✅ Payment detected.</b><br>Creating your order…</div></section>`;return `<section class="card paybox"><span class="badge">PAYMENT</span><h3>Scan QR & bayar exact amount</h3><div class="amount">${m(ps.expected_amount)}</div>${n(ps.discount)>0?`<div class="muted">Order total ${m(ps.base_amount)} · payment matching adjustment ${m(ps.discount)}</div>`:''}${D.payment_qr_url?`<img class="qr" src="${e(D.payment_qr_url)}" alt="QRPay">`:'<div class="alert">QR payment image unavailable. Jangan bayar sehingga QR dipaparkan.</div>'}<div class="muted">Payment akan detect automatik. Jangan tutup page selepas bayar.</div><p class="count">Session expires: <span id="count">${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}</span></p>${remain===0?'<button id="renew" class="btn soft">Refresh Payment Amount</button>':''}</section>`}function render(){const p=D.working_draft||{},locked=Boolean(D.customer_confirmed_at)||['confirmed','awaiting_payment','paid'].includes(D.customer_status),ship=p.delivery==='pickup'?'Pickup':String(p.delivery||'-').toUpperCase(),status=D.order?'COMPLETED':D.customer_status==='change_requested'?'CORRECTION REQUESTED':locked?'CONFIRMED':'PLEASE REVIEW';app.innerHTML=`<div class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="brand">DECOCAKE.MY</div><h2 style="margin:3px 0">Semak Order</h2></div><span class="badge ${D.order?'green':''}">${e(status)}</span></div><section class="card hero"><small>ORDER TOTAL</small><div class="amount" style="text-align:left">${m(D.draft_total)}</div><div>${e(ship)} · Date Need ${e(p.date_need||'-')}</div></section><section class="card"><h3>Items</h3>${items()}<div class="line"><span>Item subtotal</span><b>${m(D.item_subtotal)}</b></div><div class="line"><span>Shipping</span><b>${m(D.shipping_fee)}</b></div><div class="line total"><span>Total</span><span>${m(D.draft_total)}</span></div></section>${!locked&&!D.order?`<section class="card"><h3>Contact & Delivery</h3>${customerFields()}<div class="muted" style="margin-top:8px">Item, quantity dan price tidak boleh diubah di page ini. Jika salah, gunakan Request Correction.</div></section><section class="card"><button id="confirm" class="btn confirm">Confirm Order${D.payment_required?' & Continue to Payment':''}</button><button id="change" class="btn red">Request Correction</button></section>`:''}${payPanel()}</div>`;if(document.getElementById('confirm'))document.getElementById('confirm').onclick=async()=>{const delivery=String(D.working_draft?.delivery||'').toLowerCase(),address=document.getElementById('address').value.trim();if(delivery!=='pickup'&&!address){toast('Sila isi alamat sebelum Confirm Order & payment');document.getElementById('address').focus();return}if(!confirm('Confirm detail order ini?'))return;try{const customer={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address_line1:address,postcode:document.getElementById('postcode').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim()};await api('confirm',{customer});await load()}catch(x){toast(x.message)}};if(document.getElementById('change'))document.getElementById('change').onclick=async()=>{const note=prompt('Apa yang perlu dibetulkan?','');if(note!==null&&note.trim()){try{await api('request_change',{note});await load()}catch(x){toast(x.message)}}};if(document.getElementById('prepare'))document.getElementById('prepare').onclick=async()=>{try{await api('prepare_payment');await load()}catch(x){toast(x.message)}};if(document.getElementById('renew'))document.getElementById('renew').onclick=async()=>{try{await api('prepare_payment',{force_new:true});await load()}catch(x){toast(x.message)}}}function schedule(){clearTimeout(timer);if(!D)return;const waiting=D.payment_required&&!D.order&&['confirmed','awaiting_payment'].includes(D.customer_status);if(waiting)timer=setTimeout(()=>load(true),5000)}if(!/^qrc_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="wrap"><div class="alert">Invalid order link.</div></div>';else load()})();</script></body></html>
