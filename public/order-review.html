<style>
:root{--orange:#ee4d2d;--bg:#f5f5f5;--surface:#fff;--text:#242424;--muted:#777;--line:#e8e8e8;--green:#15966a;--green-bg:#edfffa;--warning:#fff8e8}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}.shell{max-width:760px;margin:auto;padding:74px 12px 102px}.checkout-head{position:fixed;z-index:30;left:0;right:0;top:0;height:62px;background:#fff;border-bottom:1px solid #ececec;display:flex;align-items:center}.checkout-head>div{width:min(760px,100%);margin:auto;display:flex;align-items:center;padding:0 13px}.checkout-head button{border:0;background:none;color:var(--orange);font-size:34px;line-height:1;padding:0 15px 3px 0}.checkout-head h1{font-size:24px;margin:0;font-weight:650}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}.customer-card{width:100%;border:0;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center}.customer-card .icon{font-size:21px;color:#1877c9}.customer-card b{display:block;font-size:15px}.customer-card span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.customer-card .arrow{font-size:20px;color:#777}.shop-title{font-size:17px;margin:0 0 18px}.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start;padding-bottom:14px}.thumb{width:72px;height:72px;border:1px solid #eee;border-radius:10px;background:#fafafa;display:grid;place-items:center;overflow:hidden;font-size:30px}.thumb img{width:100%;height:100%;object-fit:cover}.item-copy{min-width:0}.item-name{font-weight:800;font-size:14px}.item-meta{color:#777;font-size:12px;line-height:1.45;margin-top:4px}.item-wording{font-size:11px;margin-top:7px;padding:7px 8px;background:#f8f8f8;border-radius:7px;white-space:pre-wrap}.item-price{text-align:right;font-size:13px;font-weight:800;white-space:nowrap}.item-price small{display:block;color:#777;margin-bottom:4px}.locked-note{background:#fff8e7;color:#7d641f;border-radius:8px;padding:10px;font-size:11px;line-height:1.45;margin-bottom:14px}.date-row{border:2px solid #e5a33f;background:#fffaf0;border-radius:15px;padding:13px;display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:center}.date-icon{width:42px;height:42px;border-radius:11px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:20px}.date-copy b{display:flex;align-items:center;gap:7px;font-size:15px}.date-copy em{font-style:normal;background:#ce2d1c;color:#fff;border-radius:999px;padding:3px 6px;font-size:9px}.date-copy span{display:block;color:#85662b;font-size:12px;margin-top:3px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-title h2{font-size:16px;margin:0}.section-title span{color:#888;font-size:12px}.shipping-grid{display:grid;gap:9px}.shipping-option{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;color:inherit}.shipping-option.active{border-color:#2cae9c;background:var(--green-bg);box-shadow:inset 0 0 0 1px #2cae9c}.shipping-option b,.shipping-option strong{font-size:14px}.shipping-option span{display:block;margin-top:4px;color:#777;font-size:11px}.address-note{font-size:11px;color:#777;line-height:1.45;margin:-2px 0 10px}.address-list{display:grid;gap:8px}.address-choice{width:100%;text-align:left;background:#fff;border:1px solid #dedede;border-radius:11px;padding:12px;display:grid;grid-template-columns:20px 1fr;gap:9px;color:inherit}.address-choice.active{border-color:#22a66f;background:#f1fff7;box-shadow:inset 0 0 0 1px #22a66f}.radio{width:18px;height:18px;border:2px solid #bbb;border-radius:50%;margin-top:2px;position:relative}.address-choice.active .radio{border-color:#15915d}.address-choice.active .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#15915d}.address-label{font-size:12px;font-weight:800}.badge{background:#ddf8e9;color:#16824f;border-radius:999px;padding:2px 6px;font-size:8px;margin-left:5px}.address-text{font-size:11px;line-height:1.45;color:#555;margin-top:4px}.new-address-btn{width:100%;margin-top:9px;border:1px solid #e5e5e5;background:#fafafa;border-radius:10px;padding:11px;font-weight:750;font-size:12px}.new-address-btn.active{border-color:var(--orange);color:var(--orange);background:#fff8f5}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.form label{font-size:10px;color:#666;font-weight:700}.form label.wide{grid-column:1/-1}.form input,.form textarea{display:block;width:100%;margin-top:5px;border:1px solid #d8d8d8;border-radius:9px;padding:10px 11px;background:#fff;color:#222}.form textarea{min-height:72px;resize:vertical}.payment-option{border:1px solid #e5e5e5;border-radius:10px;padding:13px;display:flex;justify-content:space-between;align-items:center}.payment-option div{display:grid;gap:2px}.payment-option b{font-size:13px}.payment-option small{color:#777;font-size:10px}.payment-option i{font-style:normal;color:var(--orange);font-weight:900}.summary h2{font-size:15px;margin:0 0 11px}.summary-line{display:flex;justify-content:space-between;gap:16px;font-size:12px;padding:5px 0}.summary-line span{color:#777}.summary-line b{white-space:nowrap}.summary-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;margin-top:7px;padding-top:12px;font-size:18px;font-weight:850}.correction{width:100%;border:0;background:#fff;color:#b84d3c;border-radius:14px;padding:15px;font-size:11px;font-weight:750;margin-bottom:15px}.consent{font-size:10px;text-align:center;color:#888;padding:0 15px;line-height:1.45}.place-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e7e7e7;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:35}.place-inner{max-width:736px;margin:auto;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}.place-total small{display:block;color:#777;font-size:10px}.place-total strong{font-size:20px;color:var(--orange)}.primary{border:0;background:var(--orange);color:#fff;border-radius:9px;padding:13px 14px;font-weight:850}.primary:disabled{opacity:.55}.spinner,.alert{max-width:650px;margin:30px auto;background:#fff;border-radius:14px;padding:30px;text-align:center}.alert{color:#9b2f20}.toast{position:fixed;z-index:100;left:50%;top:15px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:750;box-shadow:0 8px 30px #0003;max-width:calc(100vw - 24px)}.modal-wrap{position:fixed;z-index:80;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));position:relative}.modal-x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:27px;color:#777}.modal h2{font-size:17px;margin:0 0 5px}.modal>p{font-size:12px;color:#666;margin:0 30px 14px 0}.review-summary{background:#f8f9fa;border-radius:12px;padding:13px}.review-row{display:grid;grid-template-columns:94px 1fr;gap:10px;padding:5px 0;font-size:12px}.review-row span{color:#7a7f88}.review-row b{text-align:right;overflow-wrap:anywhere}.review-item{border-top:1px solid #e2e2e2;margin-top:7px;padding:10px 0 3px;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px}.review-item span{grid-column:1/-1;color:#777;font-size:10px}.review-item strong{color:var(--orange)}.review-total{display:flex;justify-content:space-between;border-top:2px solid #ddd;margin-top:10px;padding-top:11px;font-size:18px}.notify{display:grid;grid-template-columns:22px 1fr;gap:8px;background:#edfff6;border:1px solid #cbeedd;border-radius:11px;padding:12px;margin:12px 0}.notify input{width:17px;height:17px;accent-color:#18ad65}.notify b{font-size:12px}.notify small{display:block;color:#6b7770;font-size:10px;margin-top:3px;line-height:1.35}.modal-actions{display:grid;gap:8px}.secondary{border:0;background:#f0f1f3;color:#222;border-radius:9px;padding:12px;font-weight:750}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 9px;font-size:10px}.chip.active{border-color:var(--orange);background:#fff5f1;color:var(--orange)}.correction-note{width:100%;min-height:85px;border:1px solid #ddd;border-radius:10px;padding:10px;margin:11px 0}.success-card{text-align:center}.success-card .tick{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:32px;margin:0 auto 10px}.success-card a{display:block;text-decoration:none;margin-top:12px}@media(min-width:700px){.modal-wrap{align-items:center;padding:18px}.modal{border-radius:16px}.shell{padding-left:18px;padding-right:18px}}@media(max-width:520px){.shell{padding-left:8px;padding-right:8px}.card{border-radius:12px;padding:13px}.item{grid-template-columns:60px 1fr auto}.thumb{width:60px;height:60px}.form{grid-template-columns:1fr}.form label.wide{grid-column:auto}.checkout-head h1{font-size:21px}}
.customer-card{align-items:start}.customer-card .customer-address{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:#555;font-size:11px;line-height:1.45}.customer-card .customer-address strong{display:block;margin-bottom:2px;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:.04em}\n</style>

<body>
<header class="checkout-head"><div><button id="back" aria-label="Kembali">‹</button><h1>Checkout</h1></div></header>
<main id="app"><div class="spinner">Memuatkan checkout…</div></main>
<script>
(()=>{
const API='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/order-draft-customer';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.getElementById('app');
let D=null,addressKey=null,delivery='',newAddress={},correctionCategory='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>String(v??'').trim();
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>'RM'+num(v).toFixed(2);
const lower=v=>text(v).toLowerCase();
const effective=x=>x?.seller_deal_price===null||x?.seller_deal_price===undefined||x?.seller_deal_price===''?num(x?.price):num(x?.seller_deal_price);
const completeAddress=a=>Boolean(text(a?.address_line1)&&/^\d{5}$/.test(text(a?.postcode).replace(/\D/g,''))&&text(a?.city)&&text(a?.state));
const addressHash=a=>[a?.address_line1,a?.address_line2,a?.postcode,a?.city,a?.state].map(v=>lower(v).replace(/\s+/g,' ')).join('|');
const option=()=>D?.delivery_options?.find(x=>x.code===delivery)||{code:delivery,label:delivery.toUpperCase(),fee:0,note:'',requires_address:true};
const baseTotal=()=>Math.max(0,num(D?.draft_total)-num(D?.shipping_fee));
const checkoutTotal=()=>baseTotal()+num(option().fee);
const currentCustomer=()=>D?.working_draft?.customer||{};
const whatsappIdentity=()=>D?.working_draft?.whatsapp_identity||D?.evidence?.whatsapp_identity||{};
const whatsappLabel=()=>{const i=whatsappIdentity();return currentCustomer().phone||D?.customer_phone||(i.username?'@'+String(i.username).replace(/^@+/,''):i.bsuid||'WhatsApp User ID')};
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),2600)}
function fmtDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(text(value)))return text(value)||'-';const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'})}
async function api(action,extra={}){const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw Error(data.error||'Request gagal');return data}
function init(){const codes=(D.delivery_options||[]).map(x=>x.code);if(!codes.includes(delivery))delivery=codes.includes(lower(D.working_draft?.delivery))?lower(D.working_draft.delivery):(codes.includes('spx')?'spx':codes[0]);const customer=currentCustomer(),saved=(D.saved_addresses||[]).filter(completeAddress);if(addressKey)return;if(completeAddress(customer))addressKey='current';else{const first=saved.find(x=>x.is_default)||saved[0];addressKey=first?'saved:'+first.id:'new'}newAddress={name:customer.name||D.customer_name||'',phone:customer.phone||D.customer_phone||'',address_line1:customer.address_line1||'',address_line2:customer.address_line2||'',postcode:customer.postcode||'',city:customer.city||'',state:customer.state||''}}
async function load(){try{const response=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Checkout tidak dijumpai');D=data.draft;if(D.order&&D.order.public_token){location.replace('/?order='+encodeURIComponent(D.order.public_token));return}if(D.order){render();return}if(D.payment_required&&D.customer_confirmed_at&&['confirmed','awaiting_payment'].includes(D.customer_status)){location.replace('/order-payment.html?token='+encodeURIComponent(token));return}init();render()}catch(error){app.innerHTML='<div class="alert">'+esc(error.message)+'</div>'}}
function itemImage(item){const url=text(item.reference_url||item.customization?.reference_url||item.product_snapshot?.image_url||item.image_url);return /^https?:\/\//i.test(url)?'<img src="'+esc(url)+'" alt="" onerror="this.parentElement.textContent=\'🍰\'">':'🍰'}
function itemMeta(item){const layers=item.customization?.layers;if(!layers)return[item.process,item.review,item.size,item.style].filter(Boolean).map(esc).join(' · ');return[item.process,item.review,'Edible: '+(layers.edible?.size||'-')+' · '+(layers.edible?.shape||'-'),'Wafer: '+(layers.wafer?.size||'-')+' · '+(layers.wafer?.shape||'-')].filter(Boolean).map(esc).join('<br>')}
function items(){const list=D.working_draft?.items||[];return list.map(item=>{const qty=Math.max(1,num(item.qty)),price=effective(item),meta=itemMeta(item);return '<article class="item"><div class="thumb">'+itemImage(item)+'</div><div class="item-copy"><div class="item-name">'+esc(item.title||item.product_type||'Item')+'</div><div class="item-meta">'+meta+'</div>'+(item.wording?'<div class="item-wording">'+esc(item.wording)+'</div>':'')+'</div><div class="item-price"><small>×'+qty+'</small>'+money(price*qty)+'</div></article>'}).join('')}
function addressData(){if(delivery==='pickup')return{name:text(currentCustomer().name||D.customer_name),phone:text(currentCustomer().phone||D.customer_phone)};if(addressKey==='current')return{...currentCustomer(),address_id:null};if(addressKey?.startsWith('saved:')){const saved=(D.saved_addresses||[]).find(x=>'saved:'+x.id===addressKey);return saved?{name:saved.recipient_name,phone:saved.phone,...saved,address_id:saved.id}:null}if(addressKey==='new')return{...newAddress,address_id:null};return null}
function addressChoices(){const current=currentCustomer(),saved=(D.saved_addresses||[]).filter(completeAddress),seen=new Set(),choices=[];if(completeAddress(current)){seen.add(addressHash(current));choices.push({key:'current',label:'Alamat daripada order ini',recipient_name:current.name||D.customer_name,phone:current.phone||D.customer_phone,...current,current:true})}saved.forEach(item=>{const hash=addressHash(item);if(seen.has(hash))return;seen.add(hash);choices.push({key:'saved:'+item.id,...item})});let html='<div class="address-list">';choices.forEach(item=>{html+='<button type="button" class="address-choice '+(addressKey===item.key?'active':'')+'" data-address="'+esc(item.key)+'"><span class="radio"></span><span><span class="address-label">'+esc(item.label||'Alamat tersimpan')+(item.is_default?'<span class="badge">DEFAULT</span>':'')+(item.current?'<span class="badge">TERKINI</span>':'')+'</span><span class="address-text"><b>'+esc(item.recipient_name||D.customer_name||'')+'</b> · '+esc(item.phone||D.customer_phone||'')+'<br>'+esc(item.address_line1||'')+(item.address_line2?'<br>'+esc(item.address_line2):'')+'<br>'+esc([item.postcode,item.city].filter(Boolean).join(' '))+(item.state?', '+esc(item.state):'')+'</span></span></button>'});html+='</div><button id="newAddress" type="button" class="new-address-btn '+(addressKey==='new'?'active':'')+'">＋ Guna alamat lain / alamat baru</button>';if(addressKey==='new')html+=addressForm();return html}
function addressForm(){const field=(id,label,value,wide=false,type='input')=>'<label class="'+(wide?'wide':'')+'">'+label+(type==='textarea'?'<textarea id="'+id+'">'+esc(value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')+'</label>';return '<div class="form">'+field('newName','Nama penerima',newAddress.name)+field('newPhone','No. WhatsApp',newAddress.phone)+field('newLine1','Alamat',newAddress.address_line1,true,'textarea')+field('newLine2','Alamat 2 (optional)',newAddress.address_line2,true)+field('newPostcode','Postcode',newAddress.postcode)+field('newCity','City',newAddress.city)+field('newState','State',newAddress.state,true)+'</div>'}
function summary(){const p=D.working_draft||{},adjust=p.price_adjustments||{},totals=p.pricing_totals||{},addon=num(totals.custom_addon??adjust.custom_addon),discount=num(totals.discount_amount),rounding=num(totals.rounding??adjust.rounding);let html='<div class="summary-line"><span>Merchandise Subtotal</span><b>'+money(D.item_subtotal)+'</b></div>';if(addon)html+='<div class="summary-line"><span>Custom Add-on</span><b>+'+money(addon)+'</b></div>';if(discount)html+='<div class="summary-line"><span>Discount</span><b>-'+money(discount)+'</b></div>';html+='<div class="summary-line"><span>Shipping Subtotal</span><b>'+money(option().fee)+'</b></div>';if(rounding)html+='<div class="summary-line"><span>Rounding</span><b>'+(rounding>0?'+':'-')+money(Math.abs(rounding))+'</b></div>';return html}
function render(){if(D.order){const order=D.order;app.innerHTML='<div class="shell"><section class="card success-card"><div class="tick">✓</div><h2>Order Confirmed</h2><p>Order <b>'+esc(order.order_no||D.order_no||'')+'</b> telah dicipta.</p>'+(order.public_token?'<a class="primary" href="/?order='+encodeURIComponent(order.public_token)+'">View Order Status</a>':'')+'</section></div>';return}const customer=currentCustomer(),cash=!D.payment_required||['cash_counter','cash_at_counter'].includes(lower(D.payment_mode));app.innerHTML='<div class="shell"><button id="customerJump" class="card customer-card"><span class="icon">👤</span><span><b>'+esc(customer.name||D.customer_name||'Maklumat customer')+'</b><span>'+esc(whatsappLabel())+'</span></span><span class="arrow">›</span></button><section class="card"><h2 class="shop-title">🏪 DecoCake.my</h2>'+items()+'<div class="locked-note">🔒 Item, variation, quantity dan harga telah ditetapkan oleh seller. Jika ada yang salah, gunakan Request Correction.</div><div class="date-row"><span class="date-icon">📅</span><span class="date-copy"><b>Date <em>WAJIB</em></b><span>'+esc(fmtDate(D.working_draft?.date_need))+'</span></span></div></section><section class="card" id="shipping"><div class="section-title"><h2>Shipping Option</h2><span>Harga tetap</span></div><div class="shipping-grid">'+(D.delivery_options||[]).map(item=>'<button type="button" class="shipping-option '+(delivery===item.code?'active':'')+'" data-delivery="'+esc(item.code)+'"><span><b>'+esc(item.label)+'</b><span>'+esc(item.note)+'</span></span><strong>'+(num(item.fee)?money(item.fee):'Free')+'</strong></button>').join('')+'</div></section>'+(delivery!=='pickup'?'<section class="card" id="address"><div class="section-title"><h2>Delivery Address</h2><span>Pilih sebelum bayar</span></div><p class="address-note">Alamat yang dipilih akan dikunci untuk order ini dan digunakan semasa create shipment/AWB.</p>'+addressChoices()+'</section>':'<section class="card"><div class="section-title"><h2>Pickup</h2></div><p class="address-note">Ambil di Bandar Baru Pasir Puteh. Alamat penghantaran tidak diperlukan.</p></section>')+'<section class="card"><div class="section-title"><h2>Payment Methods</h2></div><div class="payment-option"><div><b>'+(cash?'▤ Bayar Semasa Pickup':'▣ QR Pay')+'</b><small>'+(cash?'Bayaran dibuat di kedai apabila barang diambil':'Pembayaran dibuat selepas semakan order')+'</small></div><i>✓</i></div></section><section class="card summary"><h2>Payment Details</h2>'+summary()+'<div class="summary-total"><span>Total Payment</span><b>'+money(checkoutTotal())+'</b></div></section><button id="correction" class="correction">Ada maklumat salah? Request Correction</button><p class="consent">Dengan meneruskan, customer mengesahkan item, alamat, courier dan jumlah order adalah betul.</p></div><div class="place-bar"><div class="place-inner"><div class="place-total"><small>Total</small><strong>'+money(checkoutTotal())+'</strong></div><button id="reviewOrder" class="primary">Review Order</button></div></div>';bind()}
function captureNewAddress(){const map={newName:'name',newPhone:'phone',newLine1:'address_line1',newLine2:'address_line2',newPostcode:'postcode',newCity:'city',newState:'state'};Object.entries(map).forEach(([id,key])=>{const el=document.getElementById(id);if(el)newAddress[key]=el.value})}
function validate(){captureNewAddress();const customer=addressData();if(delivery!=='pickup'&&!completeAddress(customer))throw Error('Sila pilih atau lengkapkan alamat penghantaran');if(!text(customer?.name))throw Error('Nama customer diperlukan');if(delivery!=='pickup'&&!text(customer?.phone))throw Error('Nombor penerima diperlukan untuk courier');if(delivery==='pickup'&&!text(customer?.phone)&&!text(whatsappIdentity().bsuid))throw Error('Nombor WhatsApp atau User ID diperlukan');return customer}
function reviewModal(){let customer;try{customer=validate()}catch(error){toast(error.message);document.getElementById('address')?.scrollIntoView({behavior:'smooth'});return}const itemHtml=(D.working_draft?.items||[]).map(item=>'<div class="review-item"><b>'+Math.max(1,num(item.qty))+'× '+esc(item.title||item.product_type||'Item')+'</b><strong>'+money(effective(item)*Math.max(1,num(item.qty)))+'</strong><span>'+[item.size,item.style,item.wording].filter(Boolean).map(esc).join(' · ')+'</span></div>').join('');const address=delivery==='pickup'?'Bandar Baru Pasir Puteh':[customer.address_line1,customer.address_line2,[customer.postcode,customer.city].filter(Boolean).join(' '),customer.state].filter(Boolean).join(', ');const wrap=document.createElement('div');wrap.className='modal-wrap';wrap.innerHTML='<div class="modal"><button class="modal-x">×</button><h2>Review Order</h2><p>Semak semua maklumat sebelum teruskan ke payment.</p><section class="review-summary"><div class="review-row"><span>Customer</span><b>'+esc(customer.name)+'</b></div><div class="review-row"><span>WhatsApp</span><b>'+esc(customer.phone||whatsappLabel())+'</b></div><div class="review-row"><span>Date</span><b>'+esc(D.working_draft?.date_need||'-')+'</b></div><div class="review-row"><span>'+(delivery==='pickup'?'Pickup':'Delivery')+'</span><b>'+esc(address)+'</b></div><div class="review-row"><span>Courier</span><b>'+esc(option().label)+'</b></div><div class="review-row"><span>Payment</span><b>'+(D.payment_required?'QR Pay':'Bayar Semasa Pickup')+'</b></div>'+itemHtml+'<div class="review-total"><span>Total</span><b>'+money(checkoutTotal())+'</b></div></section><label class="notify"><input type="checkbox" checked disabled><span><b>Terima notifikasi WhatsApp</b><small>Status bayaran, design, production dan penghantaran akan dihantar oleh DecoCake.my.</small></span></label><div class="modal-actions"><button id="confirmCheckout" class="primary">'+(D.payment_required?'Confirm & Proceed to Payment':'Confirm Order')+'</button><button class="secondary" data-close>Back to Edit</button></div></div>';document.body.append(wrap);wrap.querySelector('.modal-x').onclick=()=>wrap.remove();wrap.querySelector('[data-close]').onclick=()=>wrap.remove();wrap.querySelector('#confirmCheckout').onclick=async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='Processing…';try{const result=await api('confirm',{customer,delivery,expected_version:D.version});if(result.result?.payment_required){location.href='/order-payment.html?token='+encodeURIComponent(token)}else{wrap.remove();await load()}}catch(error){if(String(error.message).includes('quote_changed')){toast('Quotation telah berubah. Sila semak jumlah terbaru.');wrap.remove();addressKey=null;await load()}else{toast(error.message);button.disabled=false;button.textContent=D.payment_required?'Confirm & Proceed to Payment':'Confirm Order'}}}}
function correctionModal(){const categories=['Item / Design','Wording','Size / Variation','Quantity','Date','Delivery / Address','Other'];const wrap=document.createElement('div');wrap.className='modal-wrap';wrap.innerHTML='<div class="modal"><button class="modal-x">×</button><h2>Ada maklumat yang salah?</h2><p>Pilih bahagian yang seller perlu betulkan.</p><div class="chips">'+categories.map(item=>'<button class="chip" data-category="'+esc(item)+'">'+esc(item)+'</button>').join('')+'</div><textarea class="correction-note" placeholder="Tulis pembetulan ringkas"></textarea><div class="modal-actions"><button id="sendCorrection" class="primary">Hantar Pembetulan</button><button class="secondary" data-close>Batal</button></div></div>';document.body.append(wrap);wrap.querySelector('.modal-x').onclick=()=>wrap.remove();wrap.querySelector('[data-close]').onclick=()=>wrap.remove();wrap.querySelectorAll('[data-category]').forEach(node=>node.onclick=()=>{correctionCategory=node.dataset.category;wrap.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===node))});wrap.querySelector('#sendCorrection').onclick=async event=>{const note=text(wrap.querySelector('textarea').value);if(!correctionCategory)return toast('Pilih bahagian yang perlu dibetulkan');if(!note)return toast('Tulis pembetulan ringkas');const button=event.currentTarget;button.disabled=true;try{await api('request_change',{note:correctionCategory+': '+note});wrap.remove();toast('Pembetulan telah dihantar');await load()}catch(error){toast(error.message);button.disabled=false}}}
function bind(){document.querySelectorAll('[data-delivery]').forEach(node=>node.onclick=()=>{captureNewAddress();delivery=node.dataset.delivery;render()});document.querySelectorAll('[data-address]').forEach(node=>node.onclick=()=>{captureNewAddress();addressKey=node.dataset.address;render()});document.getElementById('newAddress')?.addEventListener('click',()=>{addressKey='new';render()});document.getElementById('customerJump')?.addEventListener('click',()=>document.getElementById(delivery==='pickup'?'shipping':'address')?.scrollIntoView({behavior:'smooth'}));document.getElementById('reviewOrder').onclick=reviewModal;document.getElementById('correction').onclick=correctionModal}
function customerAddressPreview(){if(delivery==='pickup')return'Pickup · Bandar Baru Pasir Puteh';const customer=addressData()||currentCustomer();return[customer?.address_line1,customer?.address_line2,[customer?.postcode,customer?.city].filter(Boolean).join(' '),customer?.state].filter(Boolean).join(', ')||'Alamat belum dipilih'}
function showCustomerAddress(){const target=document.querySelector('#customerJump > span:nth-child(2)');if(!target||target.querySelector('.customer-address'))return;const address=document.createElement('span');address.className='customer-address';address.innerHTML='<strong>Address</strong>'+esc(customerAddressPreview());target.append(address)}
const customerAddressObserver=new MutationObserver(showCustomerAddress);customerAddressObserver.observe(app,{childList:true,subtree:true});
document.getElementById('back').onclick=()=>history.length>1?history.back():location.assign('/');
if(!/^qrc_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="alert">Invalid order link.</div>';else load();
})();
</script>
</body>
</html>
