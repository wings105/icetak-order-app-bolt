<style>
*{box-sizing:border-box}html{background:#f6f7f9}body{margin:0;color:#16181d;background:#f6f7f9;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}.page{max-width:760px;margin:0 auto;padding:0 12px 122px}.topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05);margin:0 -12px;padding:12px}.toprow{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:950;letter-spacing:.08em;color:#111}.status{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#fff1c7;color:#725600;font-size:11px;font-weight:900}.status.green{background:#def7e8;color:#12683a}.heading{padding:17px 2px 7px}.heading h1{font-size:27px;line-height:1.05;margin:0 0 6px;font-weight:950;letter-spacing:-.035em}.heading p{margin:0;color:#727784;font-size:13px;line-height:1.45}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0 14px}.step{background:#e8eaee;color:#8a8f99;border-radius:12px;padding:9px 8px;text-align:center;font-size:11px;font-weight:850}.step.active{background:#fff0e9;color:#e84b22;box-shadow:inset 0 0 0 1px #ffcbbd}.step.done{background:#e3f6e9;color:#17713d}.card{background:#fff;border:1px solid #e7e8eb;border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 1px 2px rgba(0,0,0,.025)}.hero{background:#17181b;color:#fff;border-color:#17181b;padding:18px}.hero-label{font-size:11px;color:#aaaeb8;letter-spacing:.08em;font-weight:850}.amount{font-size:34px;line-height:1;font-weight:950;letter-spacing:-.035em;margin:8px 0 11px}.hero-meta{display:flex;flex-wrap:wrap;gap:8px}.hero-chip{display:inline-flex;align-items:center;gap:5px;background:#292b30;border:1px solid #33363b;padding:7px 9px;border-radius:10px;font-size:12px;color:#f0f0f2}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px}.section-title h2{font-size:16px;margin:0;font-weight:950;letter-spacing:-.015em}.section-title .hint{font-size:11px;color:#8a8f99}.item{display:grid;grid-template-columns:58px 1fr auto;gap:11px;padding:13px 0;border-bottom:1px solid #edf0f2;align-items:start}.item:last-child{border-bottom:0}.thumb{width:58px;height:58px;border-radius:12px;background:#f2f3f5;border:1px solid #e3e5e8;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}.thumb img{width:100%;height:100%;object-fit:cover}.item-name{font-size:14px;font-weight:900;line-height:1.25}.item-meta{font-size:12px;color:#777d87;margin-top:4px;line-height:1.4}.item-wording{font-size:12px;background:#f7f8fa;border-radius:9px;padding:8px 9px;margin-top:8px;color:#3d4148}.item-price{text-align:right;font-size:13px;font-weight:900;white-space:nowrap}.item-price small{display:block;color:#7c828d;font-size:11px;font-weight:700;margin-bottom:2px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{border:1px solid #e8eaee;background:#fafbfc;border-radius:14px;padding:13px}.info small{display:block;color:#8a8f99;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:850;margin-bottom:5px}.info strong{font-size:14px;line-height:1.35}.delivery-row,.payment-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #e6e8eb;border-radius:14px;padding:13px 14px}.delivery-main,.payment-main{display:flex;align-items:center;gap:11px}.round-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff0e9;font-size:17px}.delivery-name,.payment-name{font-weight:900;font-size:14px}.delivery-sub,.payment-sub{font-size:11px;color:#858a94;margin-top:2px}.delivery-price{font-weight:900;font-size:13px}.address-note{font-size:12px;color:#6e7480;line-height:1.45;margin:-2px 0 11px}.address-list{display:grid;gap:9px}.address-choice{width:100%;text-align:left;background:#fff;border:1px solid #dfe2e6;border-radius:14px;padding:12px;display:flex;gap:10px;cursor:pointer;color:inherit}.address-choice.active{border-color:#27a561;background:#f2fbf6;box-shadow:0 0 0 1px #27a561}.radio-dot{width:19px;height:19px;border:2px solid #c7cbd1;border-radius:50%;flex:0 0 auto;margin-top:2px;position:relative}.address-choice.active .radio-dot{border-color:#15914f}.address-choice.active .radio-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#15914f}.address-label{font-size:12px;font-weight:950}.address-text{font-size:12px;line-height:1.45;color:#4f545d;margin-top:3px}.address-badge{display:inline-block;background:#e8f6ed;color:#19723e;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900;margin-left:5px}.new-address-btn{width:100%;margin-top:9px;border:1px dashed #cfd3d9;border-radius:13px;padding:11px 12px;background:#fafbfc;font-weight:850;color:#343840;cursor:pointer}.new-address-btn.active{border-style:solid;border-color:#f05a32;background:#fff6f2;color:#d94720}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#606670;font-weight:800}.form .wide{grid-column:1/-1}.form input,.form textarea{width:100%;border:1px solid #d9dde2;border-radius:11px;background:#fff;padding:11px 12px;font:inherit;color:#17191d;outline:none}.form input:focus,.form textarea:focus{border-color:#f05a32;box-shadow:0 0 0 3px rgba(240,90,50,.09)}.form textarea{min-height:76px;resize:vertical}.summary-line{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;padding:7px 0;font-size:13px}.summary-line span:first-child{color:#666c76}.summary-line b{white-space:nowrap}.summary-total{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e8eaed;margin-top:7px;padding-top:13px;font-size:20px;font-weight:950}.locked-note{display:flex;gap:9px;padding:10px 11px;border-radius:12px;background:#f8f3ea;color:#705b35;font-size:11px;line-height:1.45;margin-top:11px}.btn{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-size:14px;font-weight:950;cursor:pointer}.btn-primary{background:#14934f;color:#fff}.btn-secondary{background:#f1f3f5;color:#292d33}.btn-danger{background:#fff0ef;color:#b6322a}.btn:disabled{opacity:.55;cursor:not-allowed}.correction-link{width:100%;background:transparent;border:0;padding:10px;color:#b64a3e;font-size:12px;font-weight:850;cursor:pointer}.alert{padding:12px;border-radius:12px;background:#fff2dd;color:#875000;font-size:12px;line-height:1.45}.success{padding:13px;border-radius:12px;background:#e5f8ec;color:#146b36;font-size:13px;line-height:1.45}.paybox{text-align:center}.paybox h2{font-size:18px}.qr{display:block;width:min(330px,90%);height:auto;margin:14px auto;border-radius:15px;border:1px solid #e1e3e6}.count{font-weight:850;font-size:12px}.open-order{display:block;text-align:center;text-decoration:none}.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #e2e4e8;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.sticky-inner{max-width:736px;margin:auto;display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center}.sticky-total small{display:block;color:#8a8f99;font-size:10px;font-weight:800}.sticky-total strong{font-size:20px;font-weight:950}.sticky .btn{width:100%;padding:14px 16px}.spinner{padding:80px 20px;text-align:center;color:#777}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#16181d;color:#fff;padding:11px 14px;border-radius:12px;z-index:100;font-size:12px;font-weight:800;max-width:calc(100vw - 28px);box-shadow:0 8px 30px rgba(0,0,0,.18)}.modal{display:none;position:fixed;inset:0;background:rgba(10,12,15,.52);z-index:80;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.modal-card{background:#fff;border-radius:20px;width:min(600px,100%);padding:17px;box-shadow:0 20px 60px rgba(0,0,0,.24);max-height:85vh;overflow:auto}.modal-card h3{margin:0 0 5px}.modal-card p{margin:0 0 13px;color:#777d87;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #dfe2e7;border-radius:999px;background:#fff;padding:8px 10px;font-size:11px;font-weight:850;cursor:pointer}.chip.active{border-color:#f05a32;background:#fff3ee;color:#d94a24}.modal-card textarea{width:100%;min-height:90px;border:1px solid #d9dde2;border-radius:12px;padding:11px;font:inherit;margin:12px 0}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.muted{color:#858a94;font-size:12px}.tiny{font-size:10px;color:#959aa3}.hide{display:none!important}
@media(max-width:600px){.page{padding-left:9px;padding-right:9px}.topbar{margin-left:-9px;margin-right:-9px}.heading h1{font-size:25px}.card{border-radius:16px;padding:14px}.item{grid-template-columns:52px 1fr auto}.thumb{width:52px;height:52px}.info-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}.sticky-inner{grid-template-columns:90px 1fr}.amount{font-size:32px}}
</style>

<body>
<div id="app"><div class="spinner">Memuatkan tempahan…</div></div>
<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <h3>Ada maklumat yang salah?</h3>
    <p>Pilih bahagian yang perlu seller betulkan. Order tidak akan masuk payment sehingga seller semak semula.</p>
    <div id="correctionChips" class="chips"></div>
    <textarea id="correctionNote" placeholder="Contoh: wording sepatutnya Happy Birthday Aisyah"></textarea>
    <div class="modal-actions">
      <button id="closeModal" class="btn btn-secondary">Batal</button>
      <button id="sendCorrection" class="btn btn-danger">Hantar Pembetulan</button>
    </div>
  </div>
</div>
<script>
(()=>{
const API='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/order-draft-customer';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.getElementById('app');
let D=null,timer=null,addressKey=null,correctionCategory='';
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const m=v=>'RM'+n(v).toFixed(2);
const effective=x=>x?.seller_deal_price===null||x?.seller_deal_price===undefined||x?.seller_deal_price===''?n(x?.price):n(x?.seller_deal_price);
const text=v=>String(v??'').trim();
const lower=v=>text(v).toLowerCase();
function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2600)}
function fmtDate(v){const s=text(v);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return s||'-';const [y,mo,d]=s.split('-').map(Number);try{return new Date(y,mo-1,d).toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'})}catch{return s}}
function deliveryName(v){const d=lower(v);if(d==='pickup')return'Pickup';if(d==='spx')return'SPX';if(d==='jnt')return'J&T';if(d==='ninja')return'Ninja Van';return text(v).toUpperCase()||'-'}
function completeAddress(a){return Boolean(text(a?.address_line1)&&text(a?.postcode)&&text(a?.city)&&text(a?.state))}
function addressHash(a){return [a?.address_line1,a?.address_line2,a?.postcode,a?.city,a?.state].map(v=>lower(v).replace(/\s+/g,' ')).join('|')}
function currentCustomer(){return D?.working_draft?.customer||{}}
function isPickup(){return lower(D?.working_draft?.delivery)==='pickup'}
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'Request failed');return j}
async function load(silent=false){try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Order not found');D=j.draft;initAddress();render();schedule()}catch(x){if(!silent)app.innerHTML='<div class="page"><div class="alert" style="margin-top:20px">'+e(x.message)+'</div></div>'}}
function initAddress(){if(isPickup()){addressKey='pickup';return}const c=currentCustomer(),saved=(D.saved_addresses||[]).filter(completeAddress);if(addressKey&&addressKey!=='pickup')return;if(completeAddress(c)){addressKey='current';return}const def=saved.find(a=>a.is_default)||saved[0];addressKey=def?'saved:'+def.id:'new'}
function itemImage(x){const u=text(x?.reference_url||x?.customization?.reference_url||x?.product_snapshot?.image_url||x?.image_url);return /^https?:\/\//i.test(u)?`<img src="${e(u)}" alt="" onerror="this.parentElement.innerHTML='🍰'">`:'🍰'}
function itemRows(){const arr=D.working_draft?.items||[];if(!arr.length)return'<div class="alert">Item belum tersedia.</div>';return arr.map((x,i)=>{const q=Math.max(1,n(x.qty)),price=effective(x);const meta=[x.size,x.style].filter(Boolean).map(e).join(' · ');return`<div class="item"><div class="thumb">${itemImage(x)}</div><div><div class="item-name">${e(x.title||x.product_type||'Item')}</div>${meta?`<div class="item-meta">${meta}</div>`:''}${x.wording?`<div class="item-wording"><span class="tiny">WORDING / DETAIL</span><br><b>${e(x.wording).replace(/\n/g,'<br>')}</b></div>`:''}</div><div class="item-price"><small>x${q}</small>${m(price*q)}</div></div>`}).join('')}
function pricingLines(){const p=D.working_draft||{},a=p.price_adjustments||{},t=p.pricing_totals||{},addon=n(t.custom_addon??a.custom_addon),discount=n(t.discount_amount),rounding=n(t.rounding??a.rounding);let h=`<div class="summary-line"><span>Item subtotal</span><b>${m(D.item_subtotal)}</b></div>`;if(addon)h+=`<div class="summary-line"><span>Custom add-on${a.custom_addon_reason?' · '+e(a.custom_addon_reason):''}</span><b>+${m(addon)}</b></div>`;if(discount)h+=`<div class="summary-line"><span>Discount${a.discount_reason?' · '+e(a.discount_reason):''}</span><b>-${m(discount)}</b></div>`;h+=`<div class="summary-line"><span>Shipping</span><b>${m(D.shipping_fee)}</b></div>`;if(rounding)h+=`<div class="summary-line"><span>Rounding${a.rounding_reason?' · '+e(a.rounding_reason):''}</span><b>${rounding>0?'+':'-'}${m(Math.abs(rounding))}</b></div>`;return h}
function addressData(){const c=currentCustomer(),saved=D.saved_addresses||[];if(addressKey==='current')return{...c,id:null,label:'Alamat daripada order ini'};if(addressKey&&addressKey.startsWith('saved:'))return saved.find(a=>'saved:'+a.id===addressKey)||null;if(addressKey==='new'){return{name:text(document.getElementById('newName')?.value||c.name||D.customer_name),phone:text(document.getElementById('newPhone')?.value||c.phone||D.customer_phone),address_line1:text(document.getElementById('newAddress')?.value),address_line2:text(document.getElementById('newAddress2')?.value),postcode:text(document.getElementById('newPostcode')?.value),city:text(document.getElementById('newCity')?.value),state:text(document.getElementById('newState')?.value),id:null,label:'Alamat baru'}}return null}
function addressChoices(){const c=currentCustomer(),saved=(D.saved_addresses||[]).filter(completeAddress),seen=new Set(),choices=[];if(completeAddress(c)){seen.add(addressHash(c));choices.push({key:'current',label:'Alamat daripada WhatsApp / order ini',recipient_name:c.name||D.customer_name,phone:c.phone||D.customer_phone,address_line1:c.address_line1,address_line2:c.address_line2,postcode:c.postcode,city:c.city,state:c.state,is_verified:false,current:true})}saved.forEach(a=>{const h=addressHash(a);if(seen.has(h))return;seen.add(h);choices.push({key:'saved:'+a.id,...a})});let h='<div class="address-list">';for(const a of choices){const active=addressKey===a.key;h+=`<button type="button" class="address-choice ${active?'active':''}" data-address-key="${e(a.key)}"><span class="radio-dot"></span><span><span class="address-label">${e(a.label||'Alamat tersimpan')}${a.is_default?'<span class="address-badge">DEFAULT</span>':''}${a.current?'<span class="address-badge">TERKINI</span>':''}</span><div class="address-text"><b>${e(a.recipient_name||D.customer_name||'')}</b>${a.phone?' · '+e(a.phone):''}<br>${e(a.address_line1||'')}${a.address_line2?'<br>'+e(a.address_line2):''}<br>${e([a.postcode,a.city].filter(Boolean).join(' '))}${a.state?', '+e(a.state):''}</div></span></button>`}h+='</div>';h+=`<button type="button" id="useNewAddress" class="new-address-btn ${addressKey==='new'?'active':''}">＋ Guna alamat lain / alamat baru</button>`;if(addressKey==='new'){h+=newAddressForm()}return h}
function newAddressForm(){const c=currentCustomer();return`<div class="form"><label>Nama penerima<input id="newName" value="${e(c.name||D.customer_name||'')}"></label><label>No. WhatsApp<input id="newPhone" inputmode="tel" value="${e(c.phone||D.customer_phone||'')}"></label><label class="wide">Alamat<input id="newAddress" placeholder="No rumah, jalan, taman"></label><label class="wide">Alamat 2 <span class="tiny">optional</span><input id="newAddress2" placeholder="Kampung / bangunan / unit"></label><label>Postcode<input id="newPostcode" inputmode="numeric" maxlength="5"></label><label>City<input id="newCity"></label><label class="wide">State<input id="newState"></label></div>`}
function pickupContact(){const c=currentCustomer();return`<div class="form" style="margin-top:0"><label>Nama<input id="pickupName" value="${e(c.name||D.customer_name||'')}"></label><label>No. WhatsApp<input id="pickupPhone" inputmode="tel" value="${e(c.phone||D.customer_phone||'')}"></label></div>`}
function addressSection(){if(isPickup())return`<section class="card"><div class="section-title"><h2>Contact Pickup</h2></div>${pickupContact()}<div class="locked-note">🏬 Pickup di Bandar Baru Pasir Puteh. Alamat penghantaran tidak diperlukan.</div></section>`;return`<section class="card"><div class="section-title"><h2>Delivery Address</h2><span class="hint">Pilih sebelum bayar</span></div><div class="address-note">Kalau ada alamat tersimpan, pilih terus. Alamat yang dipilih akan dikunci untuk order ini sahaja.</div>${addressChoices()}</section>`}
function paymentMethodCard(){const cash=!D.payment_required||['cash_counter','cash_at_counter'].includes(lower(D.payment_mode));return`<section class="card"><div class="section-title"><h2>Payment</h2></div><div class="payment-row"><div class="payment-main"><div class="round-icon">${cash?'💵':'▣'}</div><div><div class="payment-name">${cash?'Bayar Semasa Pickup':'QR Pay'}</div><div class="payment-sub">${cash?'Bayaran dibuat di kedai apabila barang diambil':'Pembayaran dibuat selepas semakan order'}</div></div></div><b>✓</b></div></section>`}
function statusInfo(){if(D.order)return{label:'ORDER CONFIRMED',cls:'green',steps:['done','done','done']};if(D.customer_status==='change_requested')return{label:'CORRECTION REQUESTED',cls:'',steps:['active','','']};if(['confirmed','awaiting_payment'].includes(D.customer_status))return{label:'AWAITING PAYMENT',cls:'',steps:['done','active','']};return{label:'PLEASE REVIEW',cls:'',steps:['active','','']}}
function payPanel(){const ps=D.payment_session;if(D.order)return`<section class="card"><div class="success"><b>✅ Payment received & order confirmed</b><div style="margin-top:5px">Order: <b>${e(D.order.order_no||D.order_no||'')}</b></div></div>${D.order.public_token?`<a class="btn btn-secondary open-order" href="/?order=${encodeURIComponent(D.order.public_token)}">Buka Order</a>`:''}</section>`;if(D.customer_status==='change_requested')return`<section class="card"><div class="alert"><b>Pembetulan sudah dihantar.</b><br>Seller akan semak semula detail tempahan. Payment belum perlu dibuat.</div></section>`;if(!['confirmed','awaiting_payment'].includes(D.customer_status)&&D.payment_required)return'';if(!D.payment_required)return`<section class="card"><div class="success"><b>✅ Tempahan sudah disahkan.</b><br>Bayaran: ${e(D.payment_mode==='cash_counter'?'Cash at Counter':D.payment_status)}</div></section>`;if(!ps)return`<section class="card"><button id="prepare" class="btn btn-primary" style="width:100%">Generate Payment</button></section>`;const exp=ps.expires_at?new Date(ps.expires_at).getTime():0,remain=Math.max(0,Math.floor((exp-Date.now())/1000)),matched=ps.status==='matched'||D.payment_status==='paid';if(matched)return`<section class="card paybox"><div class="success"><b>✅ Payment detected.</b><br>Sistem sedang mencipta order anda…</div></section>`;return`<section class="card paybox"><span class="status">PAYMENT</span><h2>Scan QR & bayar exact amount</h2><div class="amount">${m(ps.expected_amount)}</div>${n(ps.discount)>0?`<div class="muted">Order total ${m(ps.base_amount)} · matching adjustment ${m(ps.discount)}</div>`:''}${D.payment_qr_url?`<img class="qr" src="${e(D.payment_qr_url)}" alt="QR Pay">`:'<div class="alert">QR payment image unavailable. Jangan bayar sehingga QR dipaparkan.</div>'}<div class="muted">Payment akan detect automatik. Jangan tutup page selepas bayar.</div><p class="count">Session expires: <span id="count">${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}</span></p>${remain===0?'<button id="renew" class="btn btn-secondary">Refresh Payment Amount</button>':''}</section>`}
function confirmPayload(){if(isPickup()){return{name:text(document.getElementById('pickupName')?.value||D.customer_name),phone:text(document.getElementById('pickupPhone')?.value||D.customer_phone)}}const a=addressData();if(!a||!completeAddress(a))throw Error('Sila pilih atau lengkapkan alamat penghantaran');return{name:text(a.recipient_name||a.name||D.customer_name),phone:text(a.phone||D.customer_phone),address_line1:text(a.address_line1),address_line2:text(a.address_line2),postcode:text(a.postcode),city:text(a.city),state:text(a.state),address_id:a.id||null}}
function render(){const p=D.working_draft||{},st=statusInfo(),locked=Boolean(D.customer_confirmed_at)||['confirmed','awaiting_payment','paid'].includes(D.customer_status),ship=deliveryName(p.delivery),cta=D.payment_required?`Confirm & Pay ${m(D.draft_total)}`:'Confirm Pickup Order';app.innerHTML=`<div class="page"><div class="topbar"><div class="toprow"><div class="brand">DECOCAKE.MY</div><span class="status ${st.cls}">${e(st.label)}</span></div></div><div class="heading"><h1>Semak Tempahan</h1><p>Sila pastikan item, tarikh dan penghantaran betul sebelum teruskan.</p></div><div class="steps"><div class="step ${st.steps[0]}">1 · Semak</div><div class="step ${st.steps[1]}">2 · Bayar</div><div class="step ${st.steps[2]}">3 · Siap</div></div><section class="card hero"><div class="hero-label">ORDER TOTAL</div><div class="amount">${m(D.draft_total)}</div><div class="hero-meta"><span class="hero-chip">🚚 ${e(ship)}</span><span class="hero-chip">📅 Perlu ${e(fmtDate(p.date_need||'-'))}</span></div></section><section class="card"><div class="section-title"><h2>Items</h2><span class="hint">${(p.items||[]).length} item</span></div>${itemRows()}<div class="locked-note">🔒 Item, variation, quantity dan harga telah ditetapkan oleh seller. Jika ada yang salah, gunakan Request Correction.</div></section><section class="card"><div class="section-title"><h2>Date Need & Delivery</h2></div><div class="info-grid"><div class="info"><small>Date Need</small><strong>📅 ${e(fmtDate(p.date_need||'-'))}</strong></div><div class="info"><small>Shipping Option</small><strong>${e(ship)} ${n(D.shipping_fee)>0?'· '+m(D.shipping_fee):'· Free'}</strong></div></div></section>${!locked&&!D.order?addressSection():''}${!locked&&!D.order?paymentMethodCard():''}<section class="card"><div class="section-title"><h2>Payment Details</h2></div>${pricingLines()}<div class="summary-total"><span>Total</span><span>${m(D.draft_total)}</span></div></section>${!locked&&!D.order?`<section class="card"><button id="change" class="correction-link">Ada maklumat salah? Request Correction</button></section>`:''}${payPanel()}</div>${!locked&&!D.order?`<div class="sticky"><div class="sticky-inner"><div class="sticky-total"><small>Total</small><strong>${m(D.draft_total)}</strong></div><button id="confirmOrder" class="btn btn-primary">${e(cta)}</button></div></div>`:''}`;bind()}
function bind(){document.querySelectorAll('[data-address-key]').forEach(el=>el.addEventListener('click',()=>{addressKey=el.getAttribute('data-address-key');render()}));const newBtn=document.getElementById('useNewAddress');if(newBtn)newBtn.onclick=()=>{addressKey='new';render()};const confirmBtn=document.getElementById('confirmOrder');if(confirmBtn)confirmBtn.onclick=async()=>{try{const customer=confirmPayload();if(!confirm('Confirm tempahan ini?'))return;confirmBtn.disabled=true;confirmBtn.textContent='Processing…';await api('confirm',{customer});await load()}catch(x){toast(x.message);confirmBtn.disabled=false;render()}};const change=document.getElementById('change');if(change)change.onclick=openCorrection;const prepare=document.getElementById('prepare');if(prepare)prepare.onclick=async()=>{try{await api('prepare_payment');await load()}catch(x){toast(x.message)}};const renew=document.getElementById('renew');if(renew)renew.onclick=async()=>{try{await api('prepare_payment',{force_new:true});await load()}catch(x){toast(x.message)}}}
function openCorrection(){correctionCategory='';document.getElementById('correctionNote').value='';const cats=['Item / Design','Wording','Size / Variation','Quantity','Date Need','Delivery / Address','Other'];document.getElementById('correctionChips').innerHTML=cats.map(c=>`<button type="button" class="chip" data-correction="${e(c)}">${e(c)}</button>`).join('');document.querySelectorAll('[data-correction]').forEach(el=>el.onclick=()=>{correctionCategory=el.getAttribute('data-correction');document.querySelectorAll('[data-correction]').forEach(x=>x.classList.toggle('active',x===el))});document.getElementById('modal').classList.add('show');document.getElementById('modal').setAttribute('aria-hidden','false')}
function closeCorrection(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').setAttribute('aria-hidden','true')}
document.getElementById('closeModal').onclick=closeCorrection;document.getElementById('modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeCorrection()});document.getElementById('sendCorrection').onclick=async()=>{const note=text(document.getElementById('correctionNote').value);if(!correctionCategory){toast('Pilih bahagian yang perlu dibetulkan');return}if(!note){toast('Tulis pembetulan ringkas');return}const btn=document.getElementById('sendCorrection');try{btn.disabled=true;await api('request_change',{note:`${correctionCategory}: ${note}`});closeCorrection();await load()}catch(x){toast(x.message);btn.disabled=false}}
function schedule(){clearTimeout(timer);if(!D)return;const waiting=D.payment_required&&!D.order&&['confirmed','awaiting_payment'].includes(D.customer_status);if(waiting)timer=setTimeout(()=>load(true),5000)}
if(!/^qrc_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="page"><div class="alert" style="margin-top:20px">Invalid order link.</div></div>';else load();
})();
</script>
