<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pay Order · DecoCake.my</title>
<style>
:root{--orange:#ee4d2d;--bg:#f5f5f5;--surface:#fff;--text:#242424;--muted:#777;--line:#e8e8e8;--green:#15966a}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.pay-head{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid #ececec;display:flex;align-items:center}.pay-head>div{width:min(680px,100%);margin:auto;display:flex;align-items:center;padding:0 13px}.pay-head button{border:0;background:none;color:var(--orange);font-size:34px;line-height:1;padding:0 15px 3px 0}.pay-head h1{font-size:24px;margin:0;font-weight:650}.page{max-width:620px;margin:auto;padding:14px 10px 70px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 4px 18px #0000000a}.hero{text-align:center}.reference{color:#666;font-size:12px}.hero h2{margin:5px 0 14px;font-size:18px}.countdown{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff7df;color:#7f5a00;border-radius:11px;padding:11px}.countdown span{font-size:12px}.countdown b{font-size:25px}.countdown.expired{background:#fff0f0;color:#ae2c22}.live{display:flex;align-items:center;justify-content:center;gap:8px;color:#14834e;font-size:11px;font-weight:800;margin:12px 0}.live i{width:9px;height:9px;border-radius:50%;background:#27ce77;box-shadow:0 0 0 5px #e2faed;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.2);opacity:.65}}.qr{display:block;width:min(330px,94%);height:auto;margin:14px auto;border:1px solid #eee;border-radius:14px}.qr-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.qr-actions button{border:1px solid var(--orange);background:#fff;color:var(--orange);border-radius:9px;padding:10px 5px;font-size:11px;font-weight:800}.qr-actions button:first-child{background:var(--orange);color:#fff}.instruction{font-size:12px;color:#555;line-height:1.5;margin:14px 0 7px}.amount{width:100%;border:2px dashed #d85c43;background:#fff9f6;border-radius:14px;padding:14px;display:grid;gap:3px;color:#333}.amount small,.amount span{color:#777;font-size:10px}.amount strong{font-size:35px;color:var(--orange)}.amount-adjust{background:#edfdf4;color:#157347;border-radius:8px;padding:8px;font-size:10px;margin-top:8px}.warning{font-size:11px;line-height:1.5;margin:12px 0 0}.primary{width:100%;border:0;background:var(--orange);color:#fff;border-radius:10px;padding:13px;font-weight:850;margin-top:10px}.secondary{width:100%;border:0;background:#f0f1f3;color:#222;border-radius:10px;padding:12px;font-weight:750;margin-top:9px}.panel h3{font-size:16px;margin:0 0 6px}.panel>p{font-size:12px;color:#666;line-height:1.45}.receipt-upload{display:block;border:1px dashed #aaa;border-radius:10px;padding:13px;text-align:center;margin-top:12px;font-size:12px}.receipt-upload input{display:block;margin:9px auto 0;max-width:100%}.receipt-state{display:grid;gap:6px;border-radius:10px;padding:12px;background:#fff8e6;color:#875b00;border:1px solid #f5cf73}.receipt-state a{color:#147d49;font-weight:800}.success{text-align:center;padding:30px 20px}.success-icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:34px;font-weight:900;margin:0 auto 12px}.success h2{margin:0}.success strong{display:block;color:#15803d;font-size:30px;margin:9px 0}.success p{color:#667085;line-height:1.5}.success a{display:block;text-decoration:none}.processing{text-align:center}.spinner{width:32px;height:32px;border:3px solid #e6e6e6;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;z-index:100;left:50%;top:15px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:750;box-shadow:0 8px 30px #0003;max-width:calc(100vw - 24px)}.alert{background:#fff0f0;color:#a62f24;border-radius:12px;padding:14px;text-align:center}.hidden{display:none!important}@media(max-width:430px){.page{padding-left:7px;padding-right:7px}.panel{padding:15px;border-radius:13px}.qr-actions{grid-template-columns:1fr 1fr}.qr-actions button:last-child{grid-column:1/-1}.amount strong{font-size:32px}.pay-head h1{font-size:21px}}
</style>
</head>
<body>
<header class="pay-head"><div><button id="back" aria-label="Kembali">‹</button><h1>Pay Order</h1></div></header>
<main id="app" class="page"><section class="panel processing"><div class="spinner"></div><b>Preparing secure amount…</b></section></main>
<script>
(()=>{
const API='https://buivecgahhmrhlmfujgt.supabase.co/functions/v1/order-draft-customer';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.getElementById('app');
let D=null,countdownTimer=0,pollTimer=0,lastSignature='';
const text=v=>String(v??'').trim();
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>'RM'+num(v).toFixed(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),2500)}
async function api(action,extra={}){const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw Error(data.error||'Request gagal');return data}
async function fetchDraft(){const response=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw Error(data.error||'Payment tidak dijumpai');return data.draft}
function signature(draft){const session=draft?.payment_session||{};return [draft?.order?.id,draft?.payment_status,session.id,session.status,session.receipt_name,session.expires_at].join('|')}
async function load(silent=false){try{const draft=await fetchDraft();if(!draft.order&&!draft.customer_confirmed_at){location.replace('/order-review.html?token='+encodeURIComponent(token));return}D=draft;if(D.payment_required&&!D.order&&!D.payment_session&&D.payment_status!=='paid'){const prepared=await api('prepare_payment');D=prepared.draft}const next=signature(D);if(!silent||next!==lastSignature){lastSignature=next;render()}startTimers()}catch(error){if(!silent)app.innerHTML='<div class="alert">'+esc(error.message)+'</div>'}}
function clearTimers(){clearInterval(countdownTimer);clearInterval(pollTimer);countdownTimer=0;pollTimer=0}
function startTimers(){clearTimers();if(!D||D.order)return;countdownTimer=setInterval(updateCountdown,1000);pollTimer=setInterval(()=>load(true),5000)}
function updateCountdown(){const element=document.getElementById('countdown');if(!element||!D?.payment_session)return;const left=Math.max(0,new Date(D.payment_session.expires_at).getTime()-Date.now());element.textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor((left%60000)/1000)).padStart(2,'0');if(left<=0){clearInterval(countdownTimer);render()}}
function reference(){return D.order_no||D.request_key||('Draft '+text(D.id).slice(0,8).toUpperCase())}
function render(){clearInterval(countdownTimer);if(D.order){const order=D.order;app.innerHTML='<section class="panel success"><div class="success-icon">✓</div><h2>Payment Received</h2><strong>'+money(D.payment_session?.expected_amount||D.draft_total)+'</strong><p>Bayaran telah dipadankan. Order <b>'+esc(order.order_no||D.order_no||'')+'</b> sudah masuk ke proses seterusnya.</p>'+(order.public_token?'<a class="primary" href="/?order='+encodeURIComponent(order.public_token)+'">View Order Status</a>':'')+'</section>';return}if(D.payment_status==='paid'||D.payment_session?.status==='matched'){app.innerHTML='<section class="panel processing"><div class="spinner"></div><h2>Payment detected</h2><p>Sistem sedang mencipta order anda…</p></section>';return}const session=D.payment_session;if(!session){app.innerHTML='<section class="panel"><div class="alert">Payment session belum tersedia.</div><button id="prepare" class="primary">Generate Payment</button></section>';document.getElementById('prepare').onclick=renew;return}const expires=new Date(session.expires_at).getTime(),left=Math.max(0,expires-Date.now()),expired=left<=0,receipt=Boolean(session.receipt_name),qr=D.payment_qr_url||'';app.innerHTML='<section class="panel hero"><div class="reference">Order '+esc(reference())+'</div><h2>Scan DuitNow QR</h2><div class="countdown '+(expired?'expired':'')+'"><span>'+(expired?'Session expired':'Amount reserved for')+'</span><b id="countdown">'+String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor((left%60000)/1000)).padStart(2,'0')+'</b></div><div class="live"><i></i> Live payment detection active</div>'+(qr?'<img id="paymentQr" class="qr" src="'+esc(qr)+'" alt="DuitNow QR">':'<div class="alert">QR payment image unavailable. Jangan buat bayaran.</div>')+(qr?'<div class="qr-actions"><button id="saveQr">Simpan QR</button><button id="copyAmountTop">Copy Amount</button><button id="saveCard">Simpan Gambar Bayaran</button></div>':'')+'<p class="instruction">Masukkan jumlah ini tepat semasa membuat bayaran:</p><button id="copyAmount" class="amount"><small>Exact Amount</small><strong>'+money(session.expected_amount)+'</strong><span>Tap to copy</span></button>'+(num(session.discount)>0?'<div class="amount-adjust">Jumlah order '+money(session.base_amount)+' · Pelarasan pemadanan '+money(session.discount)+'</div>':'')+'<p class="warning">Jangan round up atau ubah sen. Sistem padankan bayaran berdasarkan jumlah tepat ini.</p>'+(expired?'<button id="renew" class="primary">Generate New 10-Minute Amount</button>':'')+(!receipt?'<button id="editCheckout" class="secondary">Ubah alamat / courier</button>':'')+'</section><section class="panel"><h3>Bukti Bayaran</h3><p>Selepas bayar, snap atau upload resit JPG, PNG atau PDF.</p>'+(receipt?'<div class="receipt-state"><b>⏳ Pending Admin Approval</b><span>'+esc(session.receipt_name)+'</span>'+(session.receipt_url?'<a href="'+esc(session.receipt_url)+'" target="_blank" rel="noopener">View uploaded receipt</a>':'')+'<small>Tak perlu upload semula. Payment detection masih aktif.</small></div>':'<label class="receipt-upload">Choose Receipt<input id="receiptFile" type="file" accept="image/jpeg,image/png,application/pdf"></label><button id="uploadReceipt" class="primary">Upload Payment Receipt</button>')+'</section>';bind();if(!expired)countdownTimer=setInterval(updateCountdown,1000)}
async function copyAmount(){await navigator.clipboard.writeText(num(D.payment_session.expected_amount).toFixed(2));toast('Amount copied')}
async function imageBlob(){const response=await fetch(D.payment_qr_url,{cache:'no-store'});if(!response.ok)throw Error('QR tidak dapat dimuat turun');return response.blob()}
function download(blob,name){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function saveQr(){try{download(await imageBlob(),'decocake-duitnow-qr.png');toast('QR disimpan')}catch(error){toast(error.message)}}
async function savePaymentCard(){try{const blob=await imageBlob(),bitmap=await createImageBitmap(blob),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1450;const ctx=canvas.getContext('2d');ctx.fillStyle='#f5f5f5';ctx.fillRect(0,0,1080,1450);ctx.fillStyle='#ee4d2d';ctx.fillRect(0,0,1080,130);ctx.fillStyle='#fff';ctx.font='700 42px Arial';ctx.fillText('DecoCake.my · Pay Order',60,82);ctx.fillStyle='#fff';ctx.fillRect(55,175,970,1215);ctx.fillStyle='#222';ctx.textAlign='center';ctx.font='700 36px Arial';ctx.fillText('Scan DuitNow QR',540,245);const size=760;ctx.drawImage(bitmap,(1080-size)/2,290,size,size);ctx.fillStyle='#777';ctx.font='28px Arial';ctx.fillText('Exact Amount',540,1110);ctx.fillStyle='#ee4d2d';ctx.font='800 78px Arial';ctx.fillText(money(D.payment_session.expected_amount),540,1205);ctx.fillStyle='#444';ctx.font='24px Arial';ctx.fillText('Bayar jumlah tepat · Order '+reference(),540,1280);const output=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));download(output,'decocake-payment-'+reference().replace(/[^a-z0-9-]/gi,'_')+'.png');toast('Gambar bayaran disimpan')}catch(error){toast('Gagal simpan gambar bayaran')}}
async function renew(){const button=document.getElementById('renew')||document.getElementById('prepare');if(button){button.disabled=true;button.textContent='Generating…'}try{const result=await api('prepare_payment',{force_new:true});D=result.draft;lastSignature='';render();startTimers()}catch(error){toast(error.message);if(button)button.disabled=false}}
async function reopen(){if(!confirm('Payment session semasa akan dibatalkan. Kembali untuk ubah alamat atau courier?'))return;const button=document.getElementById('editCheckout');button.disabled=true;try{await api('reopen_checkout');location.href='/order-review.html?token='+encodeURIComponent(token)}catch(error){toast(error.message);button.disabled=false}}
function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}
async function uploadReceipt(){const input=document.getElementById('receiptFile'),file=input.files?.[0];if(!file)return toast('Pilih receipt dahulu');if(file.size>5*1024*1024)return toast('Receipt maksimum 5MB');const button=document.getElementById('uploadReceipt');button.disabled=true;button.textContent='Uploading…';try{const data=await fileBase64(file),result=await api('upload_receipt',{data,mime_type:file.type,file_name:file.name});D=result.draft;lastSignature='';toast('Receipt uploaded');render();startTimers()}catch(error){toast(error.message);button.disabled=false;button.textContent='Upload Payment Receipt'}}
function bind(){document.getElementById('copyAmount').onclick=copyAmount;document.getElementById('copyAmountTop')?.addEventListener('click',copyAmount);document.getElementById('saveQr')?.addEventListener('click',saveQr);document.getElementById('saveCard')?.addEventListener('click',savePaymentCard);document.getElementById('renew')?.addEventListener('click',renew);document.getElementById('editCheckout')?.addEventListener('click',reopen);document.getElementById('uploadReceipt')?.addEventListener('click',uploadReceipt)}
document.getElementById('back').onclick=()=>{if(D?.payment_session?.receipt_name)return history.length>1?history.back():location.assign('/');reopen()};
if(!/^qrc_[a-f0-9]{32}$/i.test(token))app.innerHTML='<div class="alert">Invalid order link.</div>';else load();
})();
</script>
</body>
</html>
